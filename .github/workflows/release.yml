name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional exact tag (e.g. v1.0.49). Leave blank to allocate the next patch version.'
        required: false
        default: ''
      commit:
        description: 'Exact merged commit SHA to build. Defaults to the triggering SHA.'
        required: false
        default: ''
      pr_number:
        description: 'Source PR number for failure reporting.'
        required: false
        default: ''
      issue_number:
        description: 'Linked issue number for failure reporting.'
        required: false
        default: ''
      run_smoke_test:
        description: 'Boot a disposable Paper server after the JAR is published.'
        required: false
        type: boolean
        default: false

# Serialize releases so two quickly merged PRs cannot reserve the same version.
concurrency:
  group: joshymc-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.commit || github.sha }}

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            LATEST=$(git tag --sort=-v:refname | grep -E '^v1\.0\.[0-9]+$' | head -1 || true)
            if [ -z "$LATEST" ]; then
              TAG="v1.0.1"
            else
              PATCH=${LATEST#v1.0.}
              TAG="v1.0.$((PATCH + 1))"
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace -PreleaseVersion="${{ steps.ver.outputs.version }}"

      - name: Inspect build outputs
        if: always()
        run: |
          echo "--- jar/ ---"
          ls -la jar/ 2>/dev/null || echo "(no jar/ dir)"
          echo "--- build/libs/ ---"
          ls -la build/libs/ 2>/dev/null || echo "(no build/libs dir)"

      - name: Verify and stage release JAR
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t JARS < <(find jar -maxdepth 1 -type f -name 'joshymc-*-all.jar' -print)
          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one shaded JAR, found ${#JARS[@]}"
            printf '%s\n' "${JARS[@]}"
            exit 1
          fi
          SRC="${JARS[0]}"
          SIZE=$(stat -c '%s' "$SRC")
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::Shaded JAR is unexpectedly small: $SIZE bytes"
            exit 1
          fi
          jar tf "$SRC" >/dev/null
          EMBEDDED_VERSION=$(unzip -p "$SRC" plugin.yml | sed -nE "s/^version: ['\"]?([^'\"]+)['\"]?$/\1/p")
          if [ "$EMBEDDED_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::plugin.yml version '$EMBEDDED_VERSION' does not match release '${{ steps.ver.outputs.version }}'"
            exit 1
          fi
          DEST="release/joshymc-${{ steps.ver.outputs.version }}.jar"
          cp "$SRC" "$DEST"
          (cd release && sha256sum "$(basename "$DEST")" > "$(basename "$DEST").sha256")
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: joshymc-${{ steps.ver.outputs.version }}
          path: release/*

      - name: Generate release notes
        id: gen-notes
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(git:*),Bash(gh:*),Read,Write" --max-turns 15'
          prompt: |
            Write user-facing GitHub Release notes for tag ${{ steps.ver.outputs.tag }}
            of the JoshyMC Paper plugin, and save them to `RELEASE_NOTES.md` at the
            repo root. Do not commit, push, or change anything else.

            Find the previous release tag:
              git tag --sort=-v:refname

            Take the tag directly below ${{ steps.ver.outputs.tag }} in that sorted list.

            If ${{ steps.ver.outputs.tag }} is the only or oldest tag, treat this as
            the first release and summarize all relevant history instead of a diff.

            Review what actually shipped between the previous tag and
            ${{ steps.ver.outputs.tag }}/HEAD:

              git log <previous-tag>..HEAD --oneline

            If PR numbers are referenced in commit messages, use:

              gh pr view <number>

            to read the PR description for additional context.

            Write RELEASE_NOTES.md using these section headings and formatting.
            Use only as many bullet points as are actually meaningful.
            Do not invent filler bullets.

            ## What's New

            • [Major player-facing feature/change]
            • [Major player-facing feature/change]

            ## Commands

            • `/command` — Description

            Omit this section if no commands were added or changed.

            ## Configuration

            • [Important configurable setting]

            Omit this section if no configuration was added or changed.

            ## Technical

            • [Important backend/safety improvement]

            Omit this section if there are no meaningful technical changes worth
            mentioning to server owners.

            Keep the notes concise and focused on meaningful changes.

            Do NOT include:
            - individual file names
            - minor refactors
            - trivial code changes
            - test implementation details
            - long explanations
            - the full GitHub issue specification

      - name: Check for generated release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ steps.source.outputs.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            release/joshymc-${{ steps.ver.outputs.version }}.jar
            release/joshymc-${{ steps.ver.outputs.version }}.jar.sha256

      - name: Create GitHub Release (fallback notes)
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.notes.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ steps.source.outputs.sha }}
          generate_release_notes: true
          files: |
            release/joshymc-${{ steps.ver.outputs.version }}.jar
            release/joshymc-${{ steps.ver.outputs.version }}.jar.sha256

      - name: Dispatch Discord notification
        # softprops/action-gh-release creates the release via GITHUB_TOKEN, so the
        # `release: published` event is suppressed (anti-recursion). Dispatch the
        # notify workflow directly because workflow_dispatch is exempt from that rule.
        if: github.event_name == 'workflow_dispatch'
        # A notification outage must not mark an already-published JAR as failed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run discord-changelog.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="${{ steps.ver.outputs.tag }}"

      - name: Report release failure
        if: ${{ failure() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          MESSAGE="Release failed for commit \`${SOURCE_SHA:-unknown}\`. No JAR should be deployed from this run. Review the [Release workflow logs]($RUN_URL)."
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$MESSAGE" || true
          fi
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$MESSAGE" || true
          fi

  paper-smoke-test:
    name: Optional Paper startup smoke test
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Set up Java 25 for Paper
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: joshymc-${{ needs.build.outputs.version }}
          path: artifact

      - name: Download latest stable Paper 1.21.11
        env:
          PAPER_VERSION: '1.21.11'
          USER_AGENT: 'JoshyMC-CI/1.0 (https://github.com/LiamBMX/joshymc-plugin)'
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          cp "artifact/joshymc-${{ needs.build.outputs.version }}.jar" smoke/plugins/

          BUILDS=$(curl --fail --silent --show-error --retry 3 \
            -H "User-Agent: $USER_AGENT" \
            "https://fill.papermc.io/v3/projects/paper/versions/$PAPER_VERSION/builds")
          PAPER_URL=$(echo "$BUILDS" | jq -r \
            'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')
          if [ -z "$PAPER_URL" ]; then
            echo "::error::No stable Paper build found for $PAPER_VERSION"
            exit 1
          fi
          curl --fail --location --show-error --retry 3 \
            -H "User-Agent: $USER_AGENT" \
            "$PAPER_URL" -o smoke/paper.jar
          echo 'eula=true' > smoke/eula.txt
          cat > smoke/server.properties <<'EOF'
          online-mode=false
          network-compression-threshold=-1
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-players=1
          EOF

      - name: Boot Paper and verify JoshyMC enables
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd smoke
          mkfifo console
          exec 3<>console
          java -Xms512M -Xmx2G -jar paper.jar --nogui <console >server.log 2>&1 &
          SERVER_PID=$!

          stop_server() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              echo stop >&3 || true
              for _ in $(seq 1 30); do
                kill -0 "$SERVER_PID" 2>/dev/null || return 0
                sleep 1
              done
              kill "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap stop_server EXIT

          STARTED=false
          for _ in $(seq 1 240); do
            if grep -Fq 'Done (' server.log 2>/dev/null; then
              STARTED=true
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ "$STARTED" != true ]; then
            echo "::error::Paper did not finish starting within 8 minutes"
            tail -n 300 server.log || true
            exit 1
          fi
          if ! grep -Fq "Enabling joshymc v$EXPECTED_VERSION" server.log; then
            echo "::error::JoshyMC $EXPECTED_VERSION did not report successful enablement"
            tail -n 300 server.log || true
            exit 1
          fi
          if grep -Eq 'Error occurred while enabling joshymc|Could not load.*joshymc|Disabling joshymc' server.log; then
            echo "::error::JoshyMC logged a load/enable failure"
            tail -n 300 server.log || true
            exit 1
          fi

          echo "Paper started and JoshyMC $EXPECTED_VERSION enabled successfully."
          stop_server
          trap - EXIT

      - name: Upload Paper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-smoke-log-${{ needs.build.outputs.version }}
          path: smoke/server.log
          if-no-files-found: ignore

      - name: Report smoke-test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          MESSAGE="The JAR for \`$TAG\` was published, but its optional Paper startup smoke test failed. Do not deploy it until the [Paper log and workflow run]($RUN_URL) are reviewed."
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$MESSAGE" || true
          fi
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$MESSAGE" || true
          fi
