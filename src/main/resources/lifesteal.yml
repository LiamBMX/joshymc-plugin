# JoshyMC Lifesteal settings (issue #1336).
#
# Only servers that run Lifesteal (config.yml > gamemode-lock.server-gamemode: lifesteal, or a
# world mapped to lifesteal under gamemode-lock.worlds) create and read this file. The Survival
# server never does. Every Paper server keeps its own copy; nothing here is shared.
#
# These are the approved Lifesteal Master Blueprint v1.1 defaults. The heart system uses the
# hearts, pvp and heart-items sections (docs/lifesteal-hearts.md), the team system the teams section
# (docs/lifesteal-teams.md), combat logging the combat-logging section (docs/lifesteal-combat.md), the launch
# schedule the progression section (docs/lifesteal-progression.md); Ranked Team Wars and seasons are
# added by later updates, which read these values. Check the file with
# /jgamemode info after editing it. While the file is invalid, hearts are paused (nothing is
# granted, stolen or changed, and stored hearts are kept as they are).
#
# A key left out uses the default below (a console warning). A value that is wrong (not a whole
# number, out of range, starting hearts above the maximum, ...) is a console error, and then the
# whole file counts as invalid: Lifesteal features refuse to start rather than guess.
#
# Fixed rules, not settings: no permanent elimination, no revival, players never lose their final
# heart, killing a player with 1 heart gives and drops no heart, Ranked Team Wars use the players'
# own gear (inventory restored afterwards) with hearts still at risk, and individual and team Elo
# are separate.

# Layout version of this file. Don't change it.
config-version: 1

# Hearts are whole hearts (1 heart = 2 health points).
hearts:
  # Hearts a new player starts with.
  starting: 10
  # The most hearts a player can have.
  maximum: 20
  # Players never drop below this (at least 1: nobody loses their final heart).
  minimum: 1

pvp:
  # Anti heart-farming: killing the same victim again within this many minutes gives no heart.
  # 0 = no cooldown.
  same-victim-cooldown-minutes: 30

# Lifesteal teams (docs/lifesteal-teams.md): /team on this server. Completely separate from the
# Survival teams; nothing here changes Survival.
teams:
  # The most players in one Lifesteal team, leader included. 1 to 5 (the approved limit is 5).
  max-size: 5
  # Turn the team system off (stored teams are kept exactly as they are).
  enabled: true
  # Seconds before a team invitation expires (10 to 3600).
  invite-expiration-seconds: 60
  # Allow players to create new teams (existing teams keep working when false).
  allow-creation: true
  # Allow leaders to disband their own team (staff can always use /team admin disband).
  allow-disbanding: true
  # Team name length. Names are letters, digits and _ only, at most 16 characters.
  name-min-length: 3
  name-max-length: 16
  # Extra names nobody may use, on top of the built-in staff and server names (admin, staff,
  # owner, moderator, joshymc, console, ...). Matched ignoring case, _ and look-alike digits.
  reserved-names: []
  # Team PvP (docs/lifesteal-teams.md, "Team PvP"). The blueprint defines no team combat rule, so
  # these are settings. Teammates are recognised by their stored team membership (never names,
  # prefixes or scoreboard teams); this never changes Survival.
  friendly-fire:
    # false = teammates can't damage each other (melee, arrows, tridents, fireworks, harmful
    # potions, TNT, End Crystals and other damage the game credits to a player), and a teammate
    # kill never steals a heart. true = teammates can damage each other like anyone else.
    enabled: false
    # Only used while enabled is true: whether killing a teammate can steal a heart. false keeps
    # teammates from farming hearts off each other (a gameplay decision still to be approved).
    heart-transfers: false
  # Team alliances (docs/lifesteal-teams.md, "Alliances and rivalries"). A team has at most one
  # alliance; both leaders must agree. Allies get friendly-fire protection and /ac alliance chat
  # only: never claims, containers, team management or anything else of the other team.
  alliances:
    # false = no alliance protection, no /ac and no alliance changes (stored alliances are kept).
    enabled: true
    # Hours before an alliance request expires (1 to 168). Counts while the server is offline.
    request-expiration-hours: 24
    # Hours BOTH teams wait after an alliance is ended by a leader before forming a new one
    # (0 to 720). A team disbanding never starts this cooldown for the surviving team.
    dissolution-cooldown-hours: 24
    # false = allied players can't damage each other (and never steal hearts from each other).
    # Inside a Ranked Team Wars match the match sides decide instead, so allies can fight there.
    friendly-fire: false
    # /ac alliance chat.
    chat-enabled: true
  # Rivalries: one declared rival per team, no approval needed. Labels only: no rewards, hearts,
  # Coins, statistics or Elo changes, and normal PvP rules apply.
  rivalries:
    enabled: true

ranked-team-wars:
  # Master switch for players (issue #1369). false = /ranked is closed and hidden for players, even
  # after the Day 3 unlock; staff with joshymc.lifesteal.ranked.admin can still set up arenas, run
  # test matches and use /ranked. Turn it on only once Ranked Team Wars have been tested on this
  # server. A missing key counts as false.
  enabled: false
  # Supported team sizes per side (2 = 2v2 ... 5 = 5v5). Each must be 2..teams.max-size.
  team-sizes: [2, 3, 4, 5]
  # Ranked match infrastructure (docs/lifesteal-ranked.md). Seconds of countdown once every player
  # is in the arena (3 to 60); no damage is possible before it ends.
  countdown-seconds: 10
  # Minutes after which an unfinished match is cancelled with no winner (1 to 120). Inventories are
  # restored either way; hearts already stolen in the match stay stolen.
  max-match-minutes: 20
  # Disconnecting from a fight that has started (docs/lifesteal-ranked-beta.md, issue #1465). The
  # leaver is always out of that match (their side loses if nobody is left) and gets their gear back
  # when they rejoin. Server shutdowns, staff kicks and server errors never cost a heart; connection
  # timeouts follow combat-logging.count-timeouts.
  disconnect-forfeit:
    # last-opponent = one heart goes to the opponent who hit them most recently within one combat-tag
    # duration, through the normal heart rules (1-heart minimum, maximum, same-victim cooldown,
    # teammates). Nobody hit them = no heart moves. none = the match forfeit only.
    heart-loss: last-opponent
  # Public matchmaking and team challenges (/ranked, docs/lifesteal-ranked-queue.md). These are
  # only waiting times and anti-spam limits; the ranked rules above don't change.
  matchmaking:
    # false = /ranked refuses new queues and challenges (staff test matches still work).
    enabled: true
    # Seconds the selected teammates have to agree before the queue/challenge roster is dropped (10-600).
    consent-seconds: 60
    # Seconds everyone in a found match has to accept it (10-120).
    confirm-seconds: 30
    # Minutes a team can wait in a queue before it is dropped (1-240). They can simply queue again.
    queue-timeout-minutes: 30
    # Seconds before a team can queue again after leaving or losing its queue entry (0-600).
    requeue-cooldown-seconds: 15
    # Seconds a player waits before queueing again after declining, ignoring or disconnecting from
    # a found match (0-1800). Never a punishment: it only stops queue spam.
    decline-cooldown-seconds: 60
    # Seconds before an unanswered team challenge expires (30-900).
    challenge-expire-seconds: 120
    # Seconds between two challenges sent by the same team (0-3600).
    challenge-cooldown-seconds: 60
  # Individual Player Elo and Team Elo (docs/lifesteal-ranked-elo.md). Two separate ratings per
  # season: a player's own, and their team's (kept by the team, not its members). The blueprint
  # gives no numbers; these are proposed defaults. Editing them never changes a stored rating:
  # initial ratings only apply to a player/team's first rated match of a season.
  elo:
    # Rating of a player / team before their first rated match of the season (minimum..maximum).
    initial-player-rating: 1000
    initial-team-rating: 1000
    # Ratings never go below / above these (0 to 100000, minimum below maximum).
    minimum-rating: 0
    maximum-rating: 5000
    # How far one match can move a rating (1 to 200). Change = K x (result - expected result).
    k-factor: 32
    # true = direct team challenges (/ranked challenge) change Elo. false: only public matchmaking
    # (/ranked queue) is rated, so two friendly teams can't farm each other. Staff test matches are
    # never rated.
    rate-challenges: false
    # Anti-farming: at most this many rated matches between the same two teams (or, by player UUID,
    # mostly the same rosters or the same two opposing players, under any team) in
    # same-opponent-window-hours (0 = no limit). Matches past the limit still count as played but
    # are recorded as unrated.
    same-opponent-limit: 3
    same-opponent-window-hours: 24
  # Anti-farming monitoring (docs/lifesteal-ranked-beta.md, issue #1474). LOGGING ONLY: it never
  # blocks a match, changes a heart transfer or a rating, or punishes anyone. After every finished
  # ranked match (staff test matches are skipped) it looks back window-hours (1-720) and writes a
  # staff review entry (/lifesteal admin ranked reviews, also in /admin logs) when a count reaches
  # its threshold (0-1000, 0 = that check off). One entry per subject per window. A mistake here
  # only turns monitoring off; hearts and ranked matches are unaffected.
  monitoring:
    enabled: true
    window-hours: 24
    # Matches between the same two teams (either order), this one included.
    repeated-team-matches: 4
    # Matches in which the same two players were opponents, whatever teams they played for.
    repeated-player-matches: 6
    # Hearts one killer took from one victim (ranked and open-world PvP together).
    repeated-heart-transfers: 3
    # Ranked matches one player forfeited by disconnecting.
    repeated-forfeits: 3
    # Opponents AltManager has seen on one connection (no address is ever logged). A shared
    # connection is not proof of one owner (households share one).
    shared-connections: true
  # Ranked leaderboards (/ranked top players|teams, docs/lifesteal-ranked-stats.md). Only players /
  # teams with at least this many rated matches this season are listed, so a fresh initial rating
  # can't top the board. Ratings below the minimum are kept and shown in /ranked stats, just not
  # ranked yet (0 to 1000).
  leaderboards:
    minimum-player-matches: 5
    minimum-team-matches: 5
    # Seconds a read leaderboard page may be reused (0 to 600). Every committed rating change
    # clears it at once, so this only bounds staleness for edge cases.
    cache-seconds: 30
  # Competitive divisions: labels computed from the current Player Elo / Team Elo every time they
  # are shown (nothing is stored, so changing a threshold never changes a rating). The blueprint
  # names no divisions; these are proposed defaults. A division needs display-name, color (#RRGGBB
  # or a colour name such as gold) and minimum-elo; team-minimum-elo (Team Elo threshold, defaults to
  # minimum-elo), icon (an item name, menus only) and description are optional. Thresholds must
  # strictly increase and the lowest one must be at or below elo.minimum-rating. A mistake here only
  # turns divisions off (see the console); it never pauses the rest of Lifesteal. Divisions give no
  # powers and no rewards.
  divisions:
    enabled: true
    tiers:
      bronze:
        display-name: "Bronze"
        color: "#CD7F32"
        minimum-elo: 0
        icon: COPPER_INGOT
        description: "Everyone starts climbing here."
      silver:
        display-name: "Silver"
        color: "#C0C0C0"
        minimum-elo: 800
        icon: IRON_INGOT
        description: "Finding your footing."
      gold:
        display-name: "Gold"
        color: gold
        minimum-elo: 1000
        icon: GOLD_INGOT
        description: "Holding your own."
      platinum:
        display-name: "Platinum"
        color: "#7FE0D8"
        minimum-elo: 1200
        icon: PRISMARINE_CRYSTALS
        description: "A proven competitor."
      diamond:
        display-name: "Diamond"
        color: aqua
        minimum-elo: 1400
        icon: DIAMOND
        description: "Among the strongest."
      master:
        display-name: "Master"
        color: light_purple
        minimum-elo: 1600
        icon: AMETHYST_SHARD
        description: "Elite competition."
      grandmaster:
        display-name: "Grandmaster"
        color: red
        minimum-elo: 1800
        icon: NETHERITE_INGOT
        description: "The very top of Ranked Team Wars."

seasons:
  # How long a season lasts, in months.
  length-months: 3

# Launch progression (docs/lifesteal-progression.md). Counted in real hours from the season's
# launch time, never calendar dates: Day 0 launch (grace starts), +24h grace ends, +72h Ranked
# Team Wars unlock, +168h the End unlocks. Downtime counts: the countdown never pauses or restarts.
# Before launch and during the grace period, players can't hurt each other and no heart is stolen;
# the End stays closed until it unlocks. Must keep grace <= ranked <= end, inside one season.
progression:
  # false = no launch schedule on this server: nothing is held back (no grace, End open).
  enabled: true
  # The launch time, only used while no season has been started yet. Leave it empty and use
  # /lifesteal admin launch schedule|activate instead, or set an ISO-8601 time WITH an offset, in
  # quotes, e.g. "2026-12-01T18:00:00Z" or "2026-12-01T13:00:00-05:00". Once a season exists, the
  # stored launch time wins and a different value here is only logged.
  launch-timestamp: ""
  # Grace period after launch, in hours. 0 = none.
  grace-period-hours: 24
  # Hours after launch Ranked Team Wars unlock (they only open once the ranked system exists).
  ranked-team-wars-unlock-after-hours: 72
  # Hours after launch the End dimension unlocks.
  end-unlock-after-hours: 168
  # One chat line on join while PvP is still off (before launch / during grace).
  join-reminder: true
  # Milestone broadcasts, to Lifesteal players only (& colour codes, \n for a new line). Each is
  # sent once per season; after downtime only the latest milestone is announced.
  announcements:
    enabled: true
    launch: "&a&lLifesteal is open!\n&7The &e24-hour grace period &7has started: no PvP and no heart stealing until it ends."
    grace-ended: "&c&lThe grace period is over!\n&7PvP is on and kills now steal hearts."
    ranked-unlocked: "&6&lRanked Team Wars are unlocked!"
    # Used instead while the ranked system isn't installed and enabled.
    ranked-unlocked-unavailable: "&6&lRanked Team Wars are unlocked by schedule.\n&7They open as soon as the ranked system is ready."
    end-unlocked: "&5&lThe End is now open!\n&7End portals work from now on."

# Physical Heart items (docs/lifesteal-hearts.md, "Heart items"). /withdrawheart turns one of your
# hearts into a Heart item; right-clicking a Heart item adds it back. The minimum and maximum
# above always apply: the final heart can never be withdrawn, and nobody redeems past the maximum.
# The blueprint doesn't define the item's look, so it is configured here. Every Heart item has a
# server-side serial number, so changing the look never invalidates existing items.
heart-items:
  # Allow /withdrawheart.
  withdraw-enabled: true
  # Allow redeeming Heart items with right-click.
  redeem-enabled: true
  # Name of newly made Heart items (& colour codes).
  display-name: "&c&lHeart"
  # Optional resource pack item model (namespace:path) for Java players. Empty = the plain Nether
  # Star, which is also what Bedrock players see.
  item-model: ""
  # Enchantment glint on Heart items.
  glint: true
  # Safeguard against click and command spam: minimum milliseconds between two withdrawals or two
  # redemptions by one player (0 to 60000).
  action-cooldown-millis: 500
  # Player messages (& colour codes). {maximum} is the maximum hearts.
  messages:
    withdrawn: "&aYou withdrew &c1 Heart&a!"
    redeemed: "&aYou redeemed &c1 Heart&a!"
    final-heart: "&cYou cannot withdraw your final heart!"
    maximum: "&cYou have already reached the maximum of {maximum} hearts!"
    inventory-full: "&cYou need inventory space to withdraw a heart!"
    redeem-failed: "&cUnable to redeem this heart. Please try again."
  # Who may make tradeable Heart items (anti alt-account heart farming, docs/lifesteal-hearts.md).
  # Both requirements must be met before /withdrawheart takes a heart. Lifesteal playtime is
  # counted by the heart system itself: only while online in a Lifesteal world and not AFK, saved
  # every minute, so it survives restarts and offline time never counts. It starts at 0 for
  # everyone when this update is installed (older playtime isn't Lifesteal-only and includes AFK).
  # Turning this off lets any player withdraw again, including brand-new alt accounts.
  withdraw-eligibility:
    enabled: true
    # Minutes of active Lifesteal playtime needed (0 = no playtime requirement, at most 43200).
    minimum-lifesteal-playtime-minutes: 120
    # Hours since the player's first Lifesteal join needed (0 = no requirement, at most 720).
    minimum-hours-since-first-join: 24
    # {time} is what is still missing.
    messages:
      playtime: "&cYou need {time} more Lifesteal playtime before you can withdraw hearts."
      account-age: "&cYour Lifesteal account is too new to withdraw hearts. You can withdraw in {time}."
  # Heart items redeemed by an account that shared a connection with the player who withdrew them.
  # A shared connection (household, school, public Wi-Fi) is not proof of one owner, so the only
  # policy is "review": the redemption always goes through, the transfer is recorded once per item
  # for staff (/lifesteal hearts reviews, the /admin log) and players are told nothing. Nobody is
  # punished, blocked or has items taken automatically.
  alt-transfer-review:
    enabled: true
    policy: review

# Heart transfer monitoring (docs/lifesteal-hearts.md, "Heart transfer monitoring", issue #1508).
# LOGGING ONLY: it never blocks, delays or reverses a transfer, takes hearts, bans, kicks or changes
# Elo. After every committed heart transfer (PvP kills, combat-tag credits, Combat NPC kills, ranked
# kills and ranked disconnect forfeits) it looks back window-hours (1-720) and records a staff review
# flag (/lifesteal hearts monitor) when a signal fires. Players are told nothing. A shared connection
# (family, college, shared housing, public Wi-Fi, VPN) is NOT proof that two accounts have one owner.
# A mistake here only turns monitoring off; hearts are unaffected.
heart-transfer-monitoring:
  enabled: true
  window-hours: 24
  # Signal A: AltManager saw the killer and the victim on one connection (only salted hashes are
  # compared; no address is stored or shown). Also needed for signal D.
  shared-connection: true
  # Signal B: hearts moved between the same two players, either direction, this one included
  # (0-1000, 0 = off). The 30-minute same-victim cooldown still applies to every transfer.
  repeated-transfers: 4
  # Signal C: hearts one victim lost to one killer with none going back (0-1000, 0 = off). Only
  # reported together with another signal: on its own it is ordinary PvP.
  one-way-transfers: 3
  # Signal D: accounts with shared-connection evidence (with each other or the recipient) that
  # gave the same player hearts (0-100, 0 = off).
  associated-accounts: 3
  # Chat notice to online staff with joshymc.lifesteal.hearts.monitor. At most one per pair of
  # players every notify-cooldown-minutes (0-10080); every flag is still recorded.
  notify-staff: true
  notify-cooldown-minutes: 60
  # Reviewed/dismissed flags older than this are deleted at startup and reload; open flags are
  # always kept (0-3650, 0 = keep everything).
  retention-days: 180

# Combat logging (docs/lifesteal-combat.md). The combat-tag duration is the existing
# config.yml > combat.tag-duration-seconds (the blueprint defines none). Blueprint v1.1 defines no
# combat-log penalty, so logging out itself costs no heart: incidents are recorded for staff
# (/lifesteal combat), and counted disconnects leave a Combat NPC (docs/lifesteal-combat-npc.md).
# Server shutdowns, staff kicks and bans and server-side errors are never counted.
combat-logging:
  # Record incidents and apply these rules (false = the plain server-wide behaviour).
  enabled: true
  # A counted combat log leaves a Combat NPC holding the player's real items, health and effects
  # (see npc below). The player is not killed. If the NPC is killed, the player dies normally
  # (drops, hearts by the normal rules); if it survives, they keep everything.
  leave-npc: true
  # Connection timeouts count as combat logs. Paper can't tell a pulled cable from a crash or a
  # Bedrock network drop; false records them without counting them.
  count-timeouts: true
  # Heart penalty for a counted combat log. Only "none": the blueprint defines no penalty.
  heart-penalty: none
  # Chat lines when combat starts and ends (the action-bar countdown is always shown).
  notifications: true
  # Incidents older than this many days are deleted at startup (1 to 3650).
  retention-days: 90
  # One console line per incident.
  diagnostic-logging: false
  # Player messages (& colour codes).
  messages:
    tagged: "&cYou are now in combat! Do not disconnect."
    expired: "&aYou are no longer in combat."
  # The Combat NPC (issue #1402). It is always passive (never attacks, picks up, trades or uses
  # anything), always holds the player's real inventory, health and potion effects, and never
  # shows its health. Anyone nearby can see and attack it, also inside protected spawn areas.
  npc:
    # Seconds the NPC stands after the disconnect (5 to 300). Real time: a restart never resets it.
    lifetime-seconds: 30
    # The line under the player's name (& colour codes).
    label: "&c[Combat Logger]"
    # Show the player's name above the label.
    show-username: true
    # Which damage can hurt the NPC.
    allow-player-damage: true
    allow-mob-damage: true
    allow-environmental-damage: true
    # Player messages (& colour codes). {death} is the death message.
    messages:
      restored: "&eYou reconnected before your Combat Logger was killed. Your items, health and effects are back where it stood."
      survived: "&aYour Combat Logger survived. Your items, health and remaining effects were kept."
      died: "&cYour Combat Logger was killed while you were offline: {death}"

# Player-funded bounties (docs/lifesteal-bounties.md): /bounty on this server. Completely separate
# from the Survival /bounty; nothing here changes Survival. Bounties only run on the dedicated
# Lifesteal server (a server that also hosts Survival keeps them off, because its coin balances
# are Survival's). This section is read on its own: a mistake here only stops new contributions
# and claims, and never pauses hearts, teams or anything else.
bounties:
  # false = no new contributions and no new claims. Nothing is deleted: active bounties still
  # expire on time and refund every contributor, and payouts already won are still paid.
  enabled: true
  # The smallest contribution, in coins. There is no maximum bounty (the only limit is
  # $10,000,000,000,000 per contribution and per bounty, the most that can be moved safely).
  minimum-contribution: 10000
  # Hours from a bounty's creation until it expires and every contributor is refunded in full
  # (1 to 8760). Later contributions never move it. A change only affects bounties created after it.
  expiration-hours: 168
  # Hours before the same hunter can claim another bounty on the same target (0 to 8760).
  claim-cooldown-hours: 24
  # Seconds between runs of the expiration / refund / payout / retry task (10 to 3600).
  sweep-interval-seconds: 60
  # Seconds before a failed payout or refund is tried again (30 to 86400).
  retry-delay-seconds: 300
  # Bounty farming signals. These are only logged for staff (/bounty admin suspicious); they never
  # block a claim, change PvP or punish anyone.
  anti-abuse:
    # This many kills of the same target by the same hunter within the window are logged (2 to 1000).
    repeat-kill-threshold: 3
    repeat-kill-window-hours: 24
    # Log claims where hunter and target have connected from the same address (the /alts data).
    # A shared address is not proof of an alt account (families, schools, VPNs).
    log-shared-connections: true
    # Also write a console line for every suspicious claim.
    console-logging: true
  gui:
    list-title: "&8Lifesteal Bounties"
    contribute-title: "&8Contribute to Bounty"
    confirm-title: "&8Confirm Contribution"
    leaderboard-title: "&8Bounty Hunters"
    # The amount buttons of the contribution screen, in coins (1 to 7; amounts below the minimum
    # are hidden). Any other amount can be typed with "Custom Amount".
    contribution-presets: [10000, 25000, 50000, 100000, 250000, 1000000]
  # Messages (& colour codes). Contributors are never named in any of them.
  messages:
    # Lifesteal-wide, once, when a bounty is created. {amount} {target}
    created: "&c&l[BOUNTY] &7A &6{amount} &7bounty has been placed on &c{target}&7!"
    # Lifesteal-wide, once, after a claim is paid. {hunter} {target} {amount}
    claimed: "&c&l[BOUNTY] &e{hunter} &7eliminated &c{target} &7and claimed &6{amount}&7!"
    # Private to the target (saved and shown on their next join if offline). {amount} {expires}
    target-notified: "&cA bounty of &6{amount} &chas been placed on you! &7It expires in &f{expires}&7. Check &e/bounty&7."
    # Private to the hunter, once the reward is in their balance. {target} {amount}
    hunter-paid: "&aYou claimed the bounty on &c{target} &aand received &6{amount}&a!"
    # Private to each contributor of an expired bounty. {target} {amount}
    refunded: "&7The bounty on &c{target} &7expired. Your contribution of &6{amount} &7was refunded."
    # Private to the contributor. {amount} {target} {total}
    contributed: "&aYou contributed &6{amount} &ato the bounty on &c{target}&a. Total: &6{total}&a."

# Team Levels, Team XP, Team Upgrades, the team bank, shared objectives and milestones
# (docs/lifesteal-team-progression.md). Lifesteal only; Survival teams are never touched. Read on its
# own: a mistake here only pauses Team Upgrades (no XP, purchases, deposits or claims) and never
# pauses hearts or teams. Turning it off (or breaking it) never deletes or changes stored progress.
team-progression:
  enabled: true
  # XP for the next level = base x currentLevel ^ exponent (1,000 x level^1.5 by default). Teams
  # start at Level 1 and there is no maximum. The level is always worked out from the total Team XP,
  # so changing the formula re-levels every team (claimed milestones and bought tiers are kept).
  levels:
    base: 1000
    exponent: 1.5
  xp:
    # Base Team XP per verified event and the most one team can earn from it per day. Only events
    # the server already verified count (see the docs); nothing can be farmed by command.
    sources:
      # A kill the heart system accepted (never teammates, allies, the same-victim cooldown or grace).
      pvp-kill: { amount: 40, daily-cap: 400 }
      # A Lifesteal bounty claimed and paid.
      bounty-claim: { amount: 75, daily-cap: 450 }
      # Each team in a rated Ranked Team Wars match (tests and unrated matches never count).
      ranked-match: { amount: 60, daily-cap: 480 }
      # The winning team of a rated match, on top of ranked-match.
      ranked-win: { amount: 120, daily-cap: 720 }
      # Per naturally generated ore (player-placed ores never count).
      ore-mined: { amount: 1, daily-cap: 300 }
      # Per 100 blocks of real movement (no teleports, no AFK, no circling in place).
      exploration: { amount: 2, daily-cap: 200 }
    # Base Team XP one team can earn per day from all sources above together.
    team-daily-cap: 2500
    # Base Team XP one member can earn for their team per day.
    member-daily-cap: 800
    # Days and weeks (caps, weekly objectives) roll over in this time zone.
    timezone: America/New_York
    anti-farm:
      # A member earns Team XP only after being in the team this long (stops team hopping).
      minimum-membership-minutes: 60
      # The same team earns PvP Team XP for the same victim at most once in this many hours.
      pvp-same-victim-hours: 24
      # Kills and bounties between players who have connected from the same address (the /alts
      # data) earn no Team XP. A shared address isn't proof of an alt; this only withholds XP.
      block-shared-connections: true
    # Ores that count as mining.
    ores: [COAL_ORE, DEEPSLATE_COAL_ORE, IRON_ORE, DEEPSLATE_IRON_ORE, COPPER_ORE, DEEPSLATE_COPPER_ORE,
      GOLD_ORE, DEEPSLATE_GOLD_ORE, REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE, LAPIS_ORE, DEEPSLATE_LAPIS_ORE,
      DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, EMERALD_ORE, DEEPSLATE_EMERALD_ORE, NETHER_GOLD_ORE,
      NETHER_QUARTZ_ORE, ANCIENT_DEBRIS]
  # The team bank pays for upgrades. Any member deposits their own coins; there is no withdrawal,
  # so bank coins never return to circulation (they stay with the team, also after a disband).
  bank:
    deposits-enabled: true
    minimum-deposit: 1000
    # The most coins the bank holds before Team Economy upgrades. Milestone rewards may go above it.
    base-capacity: 2000000
  # Upgrade tiers: cost (coins from the team bank), level (Team Level needed) and value:
  #   storage: extra team storage slots | home: extra team homes | economy: extra bank limit (coins)
  #   progression: total Team XP bonus in % (at most 10) | cosmetics: team colours unlocked (total)
  #   utility: features unlocked (total): 1 member contributions, 2 activity log, 3 XP by source
  # Only the team leader buys (Lifesteal teams have no officers). Costs and levels must not fall
  # from one tier to the next. Storage and homes stay "not available yet" until Lifesteal has team
  # storage and team homes; their tiers are kept here so they are ready then.
  upgrades:
    storage:
      enabled: false
      tiers:
        - { cost: 50000, level: 2, value: 9 }
        - { cost: 150000, level: 4, value: 9 }
        - { cost: 350000, level: 6, value: 9 }
        - { cost: 750000, level: 8, value: 9 }
        - { cost: 1500000, level: 10, value: 9 }
    home:
      enabled: false
      tiers:
        - { cost: 50000, level: 2, value: 1 }
        - { cost: 150000, level: 4, value: 1 }
        - { cost: 350000, level: 6, value: 1 }
        - { cost: 750000, level: 8, value: 1 }
        - { cost: 1500000, level: 10, value: 1 }
    economy:
      enabled: true
      tiers:
        - { cost: 50000, level: 2, value: 1000000 }
        - { cost: 150000, level: 4, value: 1000000 }
        - { cost: 350000, level: 6, value: 2000000 }
        - { cost: 750000, level: 8, value: 2000000 }
        - { cost: 1500000, level: 10, value: 3000000 }
    progression:
      enabled: true
      tiers:
        - { cost: 50000, level: 2, value: 2 }
        - { cost: 150000, level: 4, value: 4 }
        - { cost: 350000, level: 6, value: 6 }
        - { cost: 750000, level: 8, value: 8 }
        - { cost: 1500000, level: 10, value: 10 }
    cosmetics:
      enabled: true
      tiers:
        - { cost: 50000, level: 2, value: 2 }
        - { cost: 150000, level: 5, value: 5 }
        - { cost: 350000, level: 10, value: 8 }
    utility:
      enabled: true
      tiers:
        - { cost: 50000, level: 2, value: 1 }
        - { cost: 150000, level: 4, value: 2 }
        - { cost: 350000, level: 6, value: 3 }
  objectives:
    # weekly (Monday 00:00 in xp.timezone), season (once per Lifesteal season) or never (once per team).
    cycle: weekly
    # types: pvp-kills, unique-victims, bounties, ranked-matches, ranked-wins, ores, blocks-travelled,
    # unique-contributors. pools: combat, mining, exploration, teamwork (keep more than combat, so
    # teams that don't PvP can progress too). xp is paid once per cycle and is never capped.
    list:
      - { id: enemy-hunters, pool: combat, type: unique-victims, target: 25, xp: 600, name: "Eliminate 25 unique enemies" }
      - { id: bounty-hunters, pool: combat, type: bounties, target: 10, xp: 500, name: "Claim 10 bounties" }
      - { id: war-champions, pool: combat, type: ranked-wins, target: 5, xp: 750, name: "Win 5 Team Wars" }
      - { id: deep-miners, pool: mining, type: ores, target: 2500, xp: 600, name: "Mine 2,500 ores" }
      - { id: trailblazers, pool: exploration, type: blocks-travelled, target: 50000, xp: 600, name: "Travel 50,000 blocks" }
      - { id: all-hands, pool: teamwork, type: unique-contributors, target: 3, xp: 400, name: "3 members earn Team XP" }
  milestones:
    levels: [5, 10, 25, 50, 75, 100]
    # After the last level above, a milestone every this many levels (0 = none).
    every-after: 25
    # Claimed once per team, ever. Coins go to the team bank (so they can only buy upgrades).
    # title: a team title (letters, digits, spaces; up to 20) the leader can show on the team.
    rewards:
      - { level: 5, coins: 25000, title: "Rising" }
      - { level: 10, coins: 50000, title: "Established" }
      - { level: 25, coins: 100000, title: "Veteran" }
      - { level: 50, coins: 150000, title: "Elite" }
      - { level: 75, coins: 200000, title: "Legendary" }
      - { level: 100, coins: 250000, title: "Mythic" }
    # The reward of every later milestone (125, 150, ...).
    default-reward: { coins: 250000 }
  cosmetics:
    # Team name colours in unlock order (Team Cosmetics unlocks the first N).
    colors: [gold, aqua, green, light_purple, red, yellow, blue, white]
  seasons:
    # keep: Team Levels, upgrades, bank, titles and milestone claims are permanent; Team XP per season
    # is recorded as history. No other policy is approved yet (see docs/lifesteal-team-progression.md).
    reset-policy: keep
  gui:
    main-title: "Team Upgrades"
  # & colour codes. {team} {level} {objective} {xp}
  messages:
    level-up: "&6&lTEAM LEVEL UP! &e{team} &7reached &6Level {level}&7!"
    objective-completed: "&a&lOBJECTIVE &7Your team completed &f{objective} &7(+{xp} Team XP)."
    milestone-ready: "&d&lMILESTONE &7Level {level} reward is ready. &e/team milestones"
# The Protected Bank (issue #1427, docs/lifesteal-bank.md): /bank on this server. Players have a
# wallet (their normal coin balance: /balance, /pay, shops, bounties) and a protected bank. Coins
# in the bank can never be stolen in PvP. Only runs on the dedicated Lifesteal server (a server
# that also hosts Survival keeps it off, because its coin balances are Survival's). This section
# is read on its own: a mistake here only stops deposits, never hearts, coin stealing or teams.
bank:
  # false = no deposits. Nothing is deleted: bank balances are kept and can still be withdrawn,
  # so nobody's coins are ever locked away.
  enabled: true
  # The most coins one bank can hold. -1 = unlimited. Lowering it never removes coins; a bank
  # above the new limit just takes no deposits until it is below it again.
  max-capacity: -1
  # Fees as percentages (0 to 50, at most two decimals, e.g. 2.5). A fee is rounded up to the next
  # cent and is removed from the economy (a coin sink). It is shown before every confirmation.
  deposit-fee-percent: 0
  withdrawal-fee-percent: 0
  # Refuse deposits and withdrawals while combat-tagged / while in a Ranked Team Wars match.
  # Events, freezes and death always block banking.
  block-during-combat: true
  block-during-ranked: true
  # What a new season does to personal banks. Only "none" exists: no reset policy for personal
  # banks has been approved, so banks are never wiped. Every bank record stores its season.
  season-reset: none
  # The most one /bank admin add|remove may move, in coins.
  admin-max-adjustment: 1000000
  gui:
    title: "&8Protected Bank"
    confirm-title: "&8Confirm Bank Transfer"
  # Messages (& colour codes). {amount} left the source, {net} arrived, {fee} is the fee-suffix
  # line (empty without a fee), {wallet} and {bank} are the balances afterwards.
  messages:
    deposited: "&aYou deposited &6{amount} &ainto your bank.{fee} &7Wallet: &6{wallet} &8| &7Bank: &6{bank}"
    withdrew: "&aYou withdrew &6{amount} &afrom your bank.{fee} &7Wallet: &6{wallet} &8| &7Bank: &6{bank}"
    fee-suffix: " &7(fee &c{fee}&7)"

# PvP coin stealing (issue #1427, docs/lifesteal-bank.md). A legitimate Lifesteal PvP kill moves a
# share of the victim's wallet to the killer (never their bank). The same rules as heart stealing
# decide what counts (the final hit's player, no self kills, NPCs, events, the launch grace period,
# teammates, allies), but coins are decided on their own: killing a player on their last heart
# still moves coins, and a failed coin transfer never touches hearts. Read on its own: a mistake
# here only stops coin stealing.
pvp-coins:
  # false = no coins move on any death. Heart stealing is unaffected.
  enabled: true
  # Share of the victim's wallet the killer receives (0 to 100, at most two decimals). Rounded down.
  wallet-loss-percent: 10
  # The most one kill can move, in coins. -1 = no limit.
  max-per-kill: -1
  # Deaths inside a Ranked Team Wars match. Off until the policy is approved.
  ranked-enabled: false
  # Teammates, recent teammates and allies never steal coins from each other, even if the team
  # settings let them move hearts.
  block-team-farming: true
  # The same-victim cooldown below and the suspicious-kill log (/bank admin suspicious).
  anti-farming-enabled: true
  # Killing the same victim again within this many minutes moves no coins (0 = no cooldown).
  same-victim-cooldown-minutes: 30
  # This many coin steals from the same victim by the same killer within the window are logged.
  repeat-kill-threshold: 3
  repeat-kill-window-hours: 24
  # Killer and victim have connected from the same address (the /alts data): false = only logged,
  # true = no coins move. A shared address is not proof of an alt (families, schools, VPNs).
  block-shared-connections: false
  # Messages (& colour codes). The victim's bank is never shown to the killer.
  messages:
    # {amount} {killer} {wallet} (the victim's wallet afterwards). Saved for the next join if offline.
    victim: "&cYou lost &6{amount} &cin combat to &f{killer}&c! &7Wallet: &6{wallet}"
    # {amount} {victim} {wallet} (the killer's wallet afterwards).
    killer: "&aYou stole &6{amount} &afrom &f{victim}&a! &7Wallet: &6{wallet}"
