# JoshyMC Lifesteal settings (issue #1336).
#
# Only servers that run Lifesteal (config.yml > gamemode-lock.server-gamemode: lifesteal, or a
# world mapped to lifesteal under gamemode-lock.worlds) create and read this file. The Survival
# server never does. Every Paper server keeps its own copy; nothing here is shared.
#
# These are the approved Lifesteal Master Blueprint v1.1 defaults. The heart system uses the
# hearts, pvp and heart-items sections (docs/lifesteal-hearts.md), the team system the teams section
# (docs/lifesteal-teams.md); Ranked Team Wars, seasons and the launch unlocks are added by later
# updates, which read these values. Check the file with
# /jgamemode info after editing it. While the file is invalid, hearts are paused (nothing is
# granted, stolen or changed, and stored hearts are kept as they are).
#
# A key left out uses the default below (a console warning). A value that is wrong (not a whole
# number, out of range, starting hearts above the maximum, ...) is a console error, and then the
# whole file counts as invalid: Lifesteal features refuse to start rather than guess.
#
# Fixed rules, not settings: no permanent elimination, no revival, players never lose their final
# heart, killing a player with 1 heart gives and drops no heart, Ranked Team Wars use the players'
# own gear (inventory restored afterwards) with hearts still at risk, and individual and team Elo
# are separate.

# Layout version of this file. Don't change it.
config-version: 1

# Hearts are whole hearts (1 heart = 2 health points).
hearts:
  # Hearts a new player starts with.
  starting: 10
  # The most hearts a player can have.
  maximum: 20
  # Players never drop below this (at least 1: nobody loses their final heart).
  minimum: 1

pvp:
  # Anti heart-farming: killing the same victim again within this many minutes gives no heart.
  # 0 = no cooldown.
  same-victim-cooldown-minutes: 30

# Lifesteal teams (docs/lifesteal-teams.md): /team on this server. Completely separate from the
# Survival teams; nothing here changes Survival.
teams:
  # The most players in one Lifesteal team, leader included. 1 to 5 (the approved limit is 5).
  max-size: 5
  # Turn the team system off (stored teams are kept exactly as they are).
  enabled: true
  # Seconds before a team invitation expires (10 to 3600).
  invite-expiration-seconds: 60
  # Allow players to create new teams (existing teams keep working when false).
  allow-creation: true
  # Allow leaders to disband their own team (staff can always use /team admin disband).
  allow-disbanding: true
  # Team name length. Names are letters, digits and _ only, at most 16 characters.
  name-min-length: 3
  name-max-length: 16
  # Extra names nobody may use, on top of the built-in staff and server names (admin, staff,
  # owner, moderator, joshymc, console, ...). Matched ignoring case, _ and look-alike digits.
  reserved-names: []

ranked-team-wars:
  # Supported team sizes per side (2 = 2v2 ... 5 = 5v5). Each must be 2..teams.max-size.
  team-sizes: [2, 3, 4, 5]

seasons:
  # How long a season lasts, in months.
  length-months: 3

# Launch progression, counted from the season launch. Day 1 is the launch day, so day 3 means
# 48 hours after launch. Unlock days must fall inside the season.
progression:
  # Grace period after launch, in hours. 0 = none.
  grace-period-hours: 24
  # Season day Ranked Team Wars unlock.
  ranked-team-wars-unlock-day: 3
  # Season day the End dimension unlocks.
  end-unlock-day: 7

# Physical Heart items (docs/lifesteal-hearts.md, "Heart items"). /withdrawheart turns one of your
# hearts into a Heart item; right-clicking a Heart item adds it back. The minimum and maximum
# above always apply: the final heart can never be withdrawn, and nobody redeems past the maximum.
# The blueprint doesn't define the item's look, so it is configured here. Every Heart item has a
# server-side serial number, so changing the look never invalidates existing items.
heart-items:
  # Allow /withdrawheart.
  withdraw-enabled: true
  # Allow redeeming Heart items with right-click.
  redeem-enabled: true
  # Name of newly made Heart items (& colour codes).
  display-name: "&c&lHeart"
  # Optional resource pack item model (namespace:path) for Java players. Empty = the plain Nether
  # Star, which is also what Bedrock players see.
  item-model: ""
  # Enchantment glint on Heart items.
  glint: true
  # Safeguard against click and command spam: minimum milliseconds between two withdrawals or two
  # redemptions by one player (0 to 60000).
  action-cooldown-millis: 500
  # Player messages (& colour codes). {maximum} is the maximum hearts.
  messages:
    withdrawn: "&aYou withdrew &c1 Heart&a!"
    redeemed: "&aYou redeemed &c1 Heart&a!"
    final-heart: "&cYou cannot withdraw your final heart!"
    maximum: "&cYou have already reached the maximum of {maximum} hearts!"
    inventory-full: "&cYou need inventory space to withdraw a heart!"
    redeem-failed: "&cUnable to redeem this heart. Please try again."
