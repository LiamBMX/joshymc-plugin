# JoshyMC Lifesteal settings (issue #1336).
#
# Only servers that run Lifesteal (config.yml > gamemode-lock.server-gamemode: lifesteal, or a
# world mapped to lifesteal under gamemode-lock.worlds) create and read this file. The Survival
# server never does. Every Paper server keeps its own copy; nothing here is shared.
#
# These are the approved Lifesteal Master Blueprint v1.1 defaults. The heart system uses the
# hearts, pvp and heart-items sections (docs/lifesteal-hearts.md), the team system the teams section
# (docs/lifesteal-teams.md), combat logging the combat-logging section (docs/lifesteal-combat.md), the launch
# schedule the progression section (docs/lifesteal-progression.md); Ranked Team Wars and seasons are
# added by later updates, which read these values. Check the file with
# /jgamemode info after editing it. While the file is invalid, hearts are paused (nothing is
# granted, stolen or changed, and stored hearts are kept as they are).
#
# A key left out uses the default below (a console warning). A value that is wrong (not a whole
# number, out of range, starting hearts above the maximum, ...) is a console error, and then the
# whole file counts as invalid: Lifesteal features refuse to start rather than guess.
#
# Fixed rules, not settings: no permanent elimination, no revival, players never lose their final
# heart, killing a player with 1 heart gives and drops no heart, Ranked Team Wars use the players'
# own gear (inventory restored afterwards) with hearts still at risk, and individual and team Elo
# are separate.

# Layout version of this file. Don't change it.
config-version: 1

# Hearts are whole hearts (1 heart = 2 health points).
hearts:
  # Hearts a new player starts with.
  starting: 10
  # The most hearts a player can have.
  maximum: 20
  # Players never drop below this (at least 1: nobody loses their final heart).
  minimum: 1

pvp:
  # Anti heart-farming: killing the same victim again within this many minutes gives no heart.
  # 0 = no cooldown.
  same-victim-cooldown-minutes: 30

# Lifesteal teams (docs/lifesteal-teams.md): /team on this server. Completely separate from the
# Survival teams; nothing here changes Survival.
teams:
  # The most players in one Lifesteal team, leader included. 1 to 5 (the approved limit is 5).
  max-size: 5
  # Turn the team system off (stored teams are kept exactly as they are).
  enabled: true
  # Seconds before a team invitation expires (10 to 3600).
  invite-expiration-seconds: 60
  # Allow players to create new teams (existing teams keep working when false).
  allow-creation: true
  # Allow leaders to disband their own team (staff can always use /team admin disband).
  allow-disbanding: true
  # Team name length. Names are letters, digits and _ only, at most 16 characters.
  name-min-length: 3
  name-max-length: 16
  # Extra names nobody may use, on top of the built-in staff and server names (admin, staff,
  # owner, moderator, joshymc, console, ...). Matched ignoring case, _ and look-alike digits.
  reserved-names: []
  # Team PvP (docs/lifesteal-teams.md, "Team PvP"). The blueprint defines no team combat rule, so
  # these are settings. Teammates are recognised by their stored team membership (never names,
  # prefixes or scoreboard teams); this never changes Survival.
  friendly-fire:
    # false = teammates can't damage each other (melee, arrows, tridents, fireworks, harmful
    # potions, TNT, End Crystals and other damage the game credits to a player), and a teammate
    # kill never steals a heart. true = teammates can damage each other like anyone else.
    enabled: false
    # Only used while enabled is true: whether killing a teammate can steal a heart. false keeps
    # teammates from farming hearts off each other (a gameplay decision still to be approved).
    heart-transfers: false

ranked-team-wars:
  # Supported team sizes per side (2 = 2v2 ... 5 = 5v5). Each must be 2..teams.max-size.
  team-sizes: [2, 3, 4, 5]
  # Ranked match infrastructure (docs/lifesteal-ranked.md). Seconds of countdown once every player
  # is in the arena (3 to 60); no damage is possible before it ends.
  countdown-seconds: 10
  # Minutes after which an unfinished match is cancelled with no winner (1 to 120). Inventories are
  # restored either way; hearts already stolen in the match stay stolen.
  max-match-minutes: 20
  # Public matchmaking and team challenges (/ranked, docs/lifesteal-ranked-queue.md). These are
  # only waiting times and anti-spam limits; the ranked rules above don't change.
  matchmaking:
    # false = /ranked refuses new queues and challenges (staff test matches still work).
    enabled: true
    # Seconds the selected teammates have to agree before the queue/challenge roster is dropped (10-600).
    consent-seconds: 60
    # Seconds everyone in a found match has to accept it (10-120).
    confirm-seconds: 30
    # Minutes a team can wait in a queue before it is dropped (1-240). They can simply queue again.
    queue-timeout-minutes: 30
    # Seconds before a team can queue again after leaving or losing its queue entry (0-600).
    requeue-cooldown-seconds: 15
    # Seconds a player waits before queueing again after declining, ignoring or disconnecting from
    # a found match (0-1800). Never a punishment: it only stops queue spam.
    decline-cooldown-seconds: 60
    # Seconds before an unanswered team challenge expires (30-900).
    challenge-expire-seconds: 120
    # Seconds between two challenges sent by the same team (0-3600).
    challenge-cooldown-seconds: 60
  # Individual Player Elo and Team Elo (docs/lifesteal-ranked-elo.md). Two separate ratings per
  # season: a player's own, and their team's (kept by the team, not its members). The blueprint
  # gives no numbers; these are proposed defaults. Editing them never changes a stored rating:
  # initial ratings only apply to a player/team's first rated match of a season.
  elo:
    # Rating of a player / team before their first rated match of the season (minimum..maximum).
    initial-player-rating: 1000
    initial-team-rating: 1000
    # Ratings never go below / above these (0 to 100000, minimum below maximum).
    minimum-rating: 0
    maximum-rating: 5000
    # How far one match can move a rating (1 to 200). Change = K x (result - expected result).
    k-factor: 32
    # true = direct team challenges (/ranked challenge) change Elo. false: only public matchmaking
    # (/ranked queue) is rated, so two friendly teams can't farm each other. Staff test matches are
    # never rated.
    rate-challenges: false
    # Anti-farming: at most this many rated matches between the same two teams in
    # same-opponent-window-hours (0 = no limit). Matches past the limit still count as played but
    # are recorded as unrated.
    same-opponent-limit: 3
    same-opponent-window-hours: 24

seasons:
  # How long a season lasts, in months.
  length-months: 3

# Launch progression (docs/lifesteal-progression.md). Counted in real hours from the season's
# launch time, never calendar dates: Day 0 launch (grace starts), +24h grace ends, +72h Ranked
# Team Wars unlock, +168h the End unlocks. Downtime counts: the countdown never pauses or restarts.
# Before launch and during the grace period, players can't hurt each other and no heart is stolen;
# the End stays closed until it unlocks. Must keep grace <= ranked <= end, inside one season.
progression:
  # false = no launch schedule on this server: nothing is held back (no grace, End open).
  enabled: true
  # The launch time, only used while no season has been started yet. Leave it empty and use
  # /lifesteal admin launch schedule|activate instead, or set an ISO-8601 time WITH an offset, in
  # quotes, e.g. "2026-12-01T18:00:00Z" or "2026-12-01T13:00:00-05:00". Once a season exists, the
  # stored launch time wins and a different value here is only logged.
  launch-timestamp: ""
  # Grace period after launch, in hours. 0 = none.
  grace-period-hours: 24
  # Hours after launch Ranked Team Wars unlock (they only open once the ranked system exists).
  ranked-team-wars-unlock-after-hours: 72
  # Hours after launch the End dimension unlocks.
  end-unlock-after-hours: 168
  # One chat line on join while PvP is still off (before launch / during grace).
  join-reminder: true
  # Milestone broadcasts, to Lifesteal players only (& colour codes, \n for a new line). Each is
  # sent once per season; after downtime only the latest milestone is announced.
  announcements:
    enabled: true
    launch: "&a&lLifesteal is open!\n&7The &e24-hour grace period &7has started: no PvP and no heart stealing until it ends."
    grace-ended: "&c&lThe grace period is over!\n&7PvP is on and kills now steal hearts."
    ranked-unlocked: "&6&lRanked Team Wars are unlocked!"
    # Used instead while the ranked system isn't installed and enabled.
    ranked-unlocked-unavailable: "&6&lRanked Team Wars are unlocked by schedule.\n&7They open as soon as the ranked system is ready."
    end-unlocked: "&5&lThe End is now open!\n&7End portals work from now on."

# Physical Heart items (docs/lifesteal-hearts.md, "Heart items"). /withdrawheart turns one of your
# hearts into a Heart item; right-clicking a Heart item adds it back. The minimum and maximum
# above always apply: the final heart can never be withdrawn, and nobody redeems past the maximum.
# The blueprint doesn't define the item's look, so it is configured here. Every Heart item has a
# server-side serial number, so changing the look never invalidates existing items.
heart-items:
  # Allow /withdrawheart.
  withdraw-enabled: true
  # Allow redeeming Heart items with right-click.
  redeem-enabled: true
  # Name of newly made Heart items (& colour codes).
  display-name: "&c&lHeart"
  # Optional resource pack item model (namespace:path) for Java players. Empty = the plain Nether
  # Star, which is also what Bedrock players see.
  item-model: ""
  # Enchantment glint on Heart items.
  glint: true
  # Safeguard against click and command spam: minimum milliseconds between two withdrawals or two
  # redemptions by one player (0 to 60000).
  action-cooldown-millis: 500
  # Player messages (& colour codes). {maximum} is the maximum hearts.
  messages:
    withdrawn: "&aYou withdrew &c1 Heart&a!"
    redeemed: "&aYou redeemed &c1 Heart&a!"
    final-heart: "&cYou cannot withdraw your final heart!"
    maximum: "&cYou have already reached the maximum of {maximum} hearts!"
    inventory-full: "&cYou need inventory space to withdraw a heart!"
    redeem-failed: "&cUnable to redeem this heart. Please try again."

# Combat logging (docs/lifesteal-combat.md). The combat-tag duration is the existing
# config.yml > combat.tag-duration-seconds (the blueprint defines none). Blueprint v1.1 defines no
# combat-log penalty, so nobody loses a heart for logging out in combat: incidents are recorded for
# staff (/lifesteal combat), and counted disconnects keep the combat-log NPC every server already
# had. Server shutdowns, staff kicks and bans and server-side errors are never counted.
combat-logging:
  # Record incidents and apply these rules (false = the plain server-wide behaviour).
  enabled: true
  # A counted combat log leaves the existing combat-log NPC (the player dies, the NPC holds the
  # items for 60 seconds). No heart moves when the NPC or the player dies this way.
  leave-npc: true
  # Connection timeouts count as combat logs. Paper can't tell a pulled cable from a crash or a
  # Bedrock network drop; false records them without counting them.
  count-timeouts: true
  # Heart penalty for a counted combat log. Only "none": the blueprint defines no penalty.
  heart-penalty: none
  # Chat lines when combat starts and ends (the action-bar countdown is always shown).
  notifications: true
  # Incidents older than this many days are deleted at startup (1 to 3650).
  retention-days: 90
  # One console line per incident.
  diagnostic-logging: false
  # Player messages (& colour codes).
  messages:
    tagged: "&cYou are now in combat! Do not disconnect."
    expired: "&aYou are no longer in combat."
