# Lifesteal player profiles, statistics, achievements and leaderboards (issue #1429).
# Only read on a server that hosts Lifesteal. Full guide: docs/lifesteal-profiles.md.
#
# Turning anything off here never deletes player data: statistics are re-derived from the existing
# Lifesteal history (hearts, ranked, bounties) and the profile tables are kept as they are.

# false = /profile, /stats, /achievements and /lstop refuse and nothing is tracked (data is kept).
enabled: true

pvp:
  # A kill of the same player counts at most once per this many minutes for profiles, achievements
  # and leaderboards (0 to 10080). Only legitimate Lifesteal kills count at all (see the docs):
  # teammates, allies, the grace period, alt accounts that shared a connection and kills the heart
  # system refused never count.
  same-victim-cooldown-minutes: 60

achievements-settings:
  # false = no achievement progress or claims (already earned rows are kept and shown on profiles).
  enabled: true
  # How often online Lifesteal players' achievements are checked (30 to 3600 seconds). Opening
  # /achievements and joining also check.
  evaluate-interval-seconds: 120

activity:
  # Buffered activity (ores, crops, fish, mobs) is written this often (5 to 600 seconds), on quit
  # and at shutdown.
  flush-interval-seconds: 30
  # Naturally generated ores that count. Placed blocks never count.
  ores:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - NETHER_GOLD_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
  # Hostile mobs only count when they spawned for one of these reasons (no spawners, spawn eggs,
  # portals or plugin-made mobs).
  mob-spawn-reasons: [NATURAL, CHUNK_GEN, PATROL, RAID, REINFORCEMENTS, JOCKEY, MOUNT, VILLAGE_INVASION, LIGHTNING, TRAP]
  # At most this many mob kills count per player per minute (1 to 1000).
  mobs-per-minute: 40
  # At least this many seconds between two counted fish of one player (0 to 600).
  fish-min-interval-seconds: 3

profiles:
  # Players may hide their profile from other players (/profile private on). Staff with
  # joshymc.lifesteal.profile.private.bypass still see it; leaderboards still list everyone.
  allow-private: true
  # Show playtime on profiles (only ever on a Lifesteal-only server, whose playtime is Lifesteal's).
  show-playtime: true
  # The border every profile has: a stained glass colour (gray, white, red, lime, ...).
  default-border: gray

leaderboards:
  enabled: true
  # Shown in this order. kills, kill-streak, kd, bounties, achievements, playtime, player-elo, team-elo.
  # Quests completed isn't offered: Daily/Weekly quests are a Survival-only system.
  categories: [kills, kill-streak, kd, bounties, achievements, playtime, player-elo, team-elo]
  # K/D board: players need at least this many kills + deaths in the period (1 to 100000).
  kd-minimum-fights: 20
  # The boards are rebuilt from history this often (30 to 86400 seconds). Elo boards are the live
  # Ranked Team Wars leaderboards (/ranked top).
  refresh-seconds: 300

announcements:
  # Tell the player when they complete an achievement tier.
  player: true
  # Broadcast to Lifesteal players for achievements with `broadcast: true` (never hidden ones).
  broadcast: true
  broadcast-message: "&6{player} &eearned the achievement &6{achievement}&e!"

gui:
  # Chest titles (& colours, at most 28 characters).
  profile-title: "Lifesteal Profile"
  achievements-title: "Achievements"
  leaderboards-title: "Lifesteal Leaderboards"

# Achievements. The key is the achievement's stable id (lower case, digits and '-'): never rename it
# once players earned it. Tiers are numbered by their position, so only add new tiers at the end.
#
#   name / description   what players see
#   category             combat | survival | social | progression | competitive
#   stat                 pvp-kills, unique-victims, best-kill-streak, bounty-claims, ranked-matches,
#                        ranked-wins, player-division, team-division, team-joined, ores-mined,
#                        crops-harvested, fish-caught, mobs-killed, dimensions-explored, playtime-hours
#   type                 permanent (once ever) | seasonal (once per season, from that season's numbers;
#                        not for team-joined or playtime-hours)
#   visibility           visible | hidden (shown as ??? until its first tier is completed)
#   icon                 any item name
#   broadcast            true = announce completions to Lifesteal players
#   tiers                list of { name (optional, e.g. Bronze), target (or division: <id> for the
#                        division stats), rewards }
#
# Rewards (each claimed once, delivered by the store delivery queue: coins/credits work offline,
# items wait for inventory room and are never dropped):
#   coins <amount>                 Lifesteal coins (only on a Lifesteal-only server)
#   credits <amount>
#   tokens <quantity>
#   cratekey <crate> <quantity>    an existing crate
#   chattagvoucher <tag> <quantity> an existing chat tag voucher
#   title <text>                   a profile title (& colours)
#   border <colour>                a profile border (stained glass colour)
# Hearts, ranks, rank vouchers and ranked advantages can't be rewards.
achievements:
  # ── Combat ─────────────────────────────────────────────
  first-blood:
    name: "First Blood"
    description: "Win your first legitimate PvP fight."
    category: combat
    stat: pvp-kills
    icon: WOODEN_SWORD
    tiers:
      - target: 1
        rewards: ["coins 1000"]
  slayer:
    name: "Slayer"
    description: "Win legitimate PvP fights."
    category: combat
    stat: pvp-kills
    icon: IRON_SWORD
    tiers:
