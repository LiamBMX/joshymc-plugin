        rewards: ["coins 5000"]
      - name: Silver
        target: 50
        rewards: ["coins 20000", "border red"]
      - name: Gold
        target: 100
        rewards: ["coins 50000", "title &cSlayer"]
      - name: Diamond
        target: 250
        rewards: ["coins 100000", "title &b&lWarlord"]
    broadcast: true
  executioner:
