# /punish rules (issue #1298). Staff run /punish <player> <rule>; the rule's next tier is
# picked from the player's earlier offenses of that rule and shown for confirmation first.
# Apply edits without a restart with /punish reload.
#
# Rule ids and keywords are fixed (history is stored by id). Per rule you may set:
#   tiers:     exactly five tiers, offense 1 to 5 (offenses after the fifth keep tier 5):
#                W      warning              K       kick (player must be online)
#                M<len> mute, e.g. M10m      B<len>  temporary ban, e.g. B7d
#                PB     permanent ban        +B<len> extend the active ban by <len>
#                EXT    extend the active ban by its own original length
#              "W|B1d" offers an alternative staff may pick with `alt` plus a written justification.
#              Lengths: s, m, h, d, w, mo (30 days).
#   name:      the reason players see (never the keyword).
#   gamemodes: [survival, lifesteal] - where the rule can be punished.
#   window:    minor | serious - which escalation window counts earlier offenses.
# Informational rules (no tiers) can never be punished. A rule left out of this file, or with
# invalid values, uses the built-in defaults (logged at load).
#
# Who may punish what (joshymc.punish.<level>, each level inherits the ones below):
#   trainee  warnings only            helper / jrmod  warnings + temporary mutes
#   mod      + kicks, bans up to 7d   leadmod / jradmin  bans up to 30d
#   admin    + permanent bans         sradmin  + tier overrides, reviews, any reversal
#   joshymc.punish.network (Managers/Owner): approve network-wide mutes/bans. Admins may
#   only issue emergency network-wide suspensions up to emergency-network-max-hours.
settings:
  # How long a /punish confirmation stays usable.
  confirmation-expiry-seconds: 120
  # Earlier offenses older than this stop counting towards the next tier (audit history is kept).
  escalation-window-days:
    minor: 90
    serious: 365
  emergency-network-max-hours: 24
  emergency-review-hours: 6
  # Bans (and network-wide, overridden or alternative punishments) need evidence or a reference.
  require-evidence-for-bans: true

