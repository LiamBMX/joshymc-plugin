# ============================================================
# Daily / Weekly / Quest Master quest definitions
# ============================================================
# This file is PLAYER-EDITABLE. On startup the plugin copies this file to
# plugins/Joshymc/config/quest-cycle.yml (or plugins/Joshymc/quest-cycle.yml)
# if it doesn't exist yet, and afterwards only ADDS quest ids that are new to
# the bundled defaults — it never overwrites or removes entries you've
# already edited. Delete an entry (or set enabled: false) to remove it from
# rotation without losing the rest of your edits.
#
# Fields per quest:
#   name          - display name shown in the GUI
#   description   - short objective line, e.g. "Mine 500 Stone"
#   category      - MINING, WOODCUTTING, FARMING, COMBAT, ANIMALS, FISHING,
#                   CRAFTING, SMELTING, GENERAL, EXPLORATION, EXPERIENCE
#   quest-type    - DAILY_MEDIUM, DAILY_HARD, or WEEKLY
#   objective     - MINE_BLOCK, BREAK_LOG, HARVEST_CROP, KILL_MOB,
#                   BREED_ANIMAL, CATCH_FISH, SMELT_ITEM, CRAFT_ITEM,
#                   TRAVEL, TRAVEL_NETHER, GAIN_XP, GAIN_LEVELS,
#                   ENCHANT_ITEM, TRADE_VILLAGER, PLACE_BLOCK
#   target        - what the objective is matched against:
#                     MINE_BLOCK/BREAK_LOG/HARVEST_CROP/SMELT_ITEM: a Material
#                       name, "ANY", or (SMELT_ITEM only) "ORE_PRODUCT" for
#                       smelted ore ingots specifically
#                     KILL_MOB: an EntityType name, "ANY", "HOSTILE"
#                       (any hostile mob), "NETHER_HOSTILE" (hostile mob
#                       killed while in the Nether), or "PASSIVE_ANIMAL"
#                     BREED_ANIMAL/CATCH_FISH: an EntityType/Material name
#                       or "ANY"
#                     Everything else: "ANY"
#   amount        - required progress amount
#   reward        - money awarded on individual completion
#   icon          - GUI display Material
#   enabled       - set to false to remove a quest from rotation
