# Auto Restart — periodically restart the server to prevent memory-related disconnects
auto-restart:
  enabled: true
  # How often to restart (hours). Default: 12
  interval-hours: 12.0
  # How many seconds before restart to begin the countdown broadcast. Default: 300 (5 min)
  warning-seconds: 300

# AntiCheat — server-side cheat detection
anticheat:
  enabled: true
  alert-vl: 20          # VL threshold to alert staff
  kick-vl: 150          # VL threshold to kick player (very high to avoid false kicks)
  alert-cooldown-ms: 3000  # Cooldown between alerts per check per player
  # Separate cooldown for the Discord staff anti-cheat alert, per player per check. Detections
  # held back are posted as one grouped follow-up when it ends. 0 sends every in-game alert.
  discord-alert-cooldown-seconds: 30
  checks:
    flight: true         # Detects fly hacks (sustained air time, ascending without jump)
    speed: true          # Detects speed hacks (moving faster than possible)
    nofall: true         # Detects NoFall (spoofing ground status to avoid fall damage)
    jesus: true          # Detects water/lava walking
    phase: true          # Detects noclip/phase through solid blocks
    timer: true          # Detects timer hacks (modified tick rate, >20 packets/sec)
    killaura: true       # Detects KillAura (attack rate, hitting behind back)
    reach: true          # Detects reach hacks (hitting/breaking from too far)
    autoclick: true      # Detects autoclickers (>22 CPS)
    velocity: true       # Detects anti-knockback (not moving after being hit)
    fastbreak: true      # Detects fast block breaking
    fastplace: true      # Detects fast block placing (>18 blocks/sec)
    scaffold: true       # Detects scaffold hacks (bridging at impossible speed)
    nuker: true          # Detects nuker (breaking >80 blocks/sec)
    badpackets: true     # Detects invalid packets (impossible pitch, actions while dead)
    illegitems: true     # Detects illegal items (over-enchanted, stacked unstackables)
    aimsnap: true        # Detects aim-lock/kill-aura snaps (extreme rotation + immediate precise hit)

# Daily / Weekly / Quest Master quest system — /quests
# Quest definitions themselves (names, objectives, amounts, per-quest rewards,
# icons, categories) live in a separate player-editable file:
# plugins/Joshymc/config/quest-cycle.yml (see that file for the full list).
# This section only controls selection counts, reset schedule, repeat
# protection, and the bonus/completion rewards.
quests:
  # IANA time zone used for all daily/weekly scheduling (handles DST automatically)
  timezone: "America/New_York"

  daily:
    selected-medium: 2
    selected-hard: 1
    reset:
      hour: 0
      minute: 0
    repeat-protection-days: 7
    completion-reward:
      # Grants exactly one key when enabled: Harvest Key 70% / Stockpile Key 20% / Homestead Key 10%.
      enabled: true
      # Credits paid once per daily cycle for finishing all Daily Quests (with the key above).
      credits: 250
      # Optional extra commands run on top of the key above. {player} is replaced with the
      # player's name. Commands run from console.
      commands: []

  weekly:
    selected: 3
    reset:
      day: "MONDAY"
      hour: 0
      minute: 0
    repeat-protection-weeks: 4
    completion-reward:
      enabled: true
      # In addition to any commands below, completing every Weekly Quest always grants
      # exactly one weighted-random crate key (Homestead Key 70% / Campfire Key 25% /
      # Cabin Key 5%) — handled internally, not configurable here.
      # Credits paid once per weekly cycle for finishing all Weekly Quests (with the key).
      credits: 750
      commands: []

  # Action-bar "Quest Progress: <quest> 250/500" when Daily/Weekly progress goes up.
  # Players can turn it off in /settings (Quest Progress). One update per player at
  # most every interval-seconds, showing the quest that moved last.
  progress-notifications:
    enabled: true
    interval-seconds: 3

  quest-master:
    enabled: true
    required-daily-sets: 5
    require-weekly-completion: true
    reward:
      commands:
        - "credits give {player} 1000"
    inventory: true      # Detects inventory hacks (>25 clicks/sec)

# Custom branded ban/tempban disconnect + rejoin screens for /punish (and /ban, /tempban).
# Each list entry is one line of the screen, parsed with the same &/&#RRGGBB color codes
# used everywhere else in this config. If a template is missing or fails to format, a
