    display: "&7[&#FFF08DS&#F5DF68O&#ECCF42T&#F5DF68M&7]&r"
    default-duration: "30d"
    allowed-durations:
      - "1d"
      - "7d"
      - "14d"
      - "21d"
      - "30d"
    auto-equip: true
    show-in-chat: true
    show-in-tab: true

# Candy Shop (issue #1211): the Candy Man opens /candy (alias /trickortreat) four times a day at
# random quarter hours, at least 3 hours apart, for 30 minutes, selling 3 different candies for
# Money (never Credits). Admins fill the pool with /candy admin additem <price> <percentage>
# while holding a registered candy. Applies on /joshymc reload.
candy-shop:
  # IANA time zone the daily schedule follows (e.g. America/New_York, Europe/London).
  # Empty = America/New_York, the server's default zone.
  timezone: ""
  # Each candy's percentage is its chance to be in an opening. Exactly 3 candies are sold per
  # opening, so the enabled chances can only all be exact when they add up to 300%.
  #   normalize: scale every chance by the same factor so they add up to 300% (capped at 100%);
  #              /candy admin list shows the effective chances whenever they differ.
  #   exact:     the enabled chances must add up to 300%, otherwise openings are skipped and
  #              admins are told why.
  probability-mode: normalize
  # Announcements and the closed message. & colour codes; {minutes} = minutes left.
  messages:
    open: "&d&l🍬 Candy Man&d: &f\"I've arrived with some sweet surprises! The Candy Shop is now &a&lOPEN&f for 30 minutes! Use &d/candy&f to see what's for sale!\""
    # Sent instead of "open" when the server starts in the middle of an opening.
    resumed: "&d&l🍬 Candy Man&d: &f\"I've arrived with some sweet surprises! The Candy Shop is &a&lOPEN&f for {minutes} more minutes! Use &d/candy&f to see what's for sale!\""
    close: "&d&l🍬 Candy Man&d: &f\"That's all for now! The Candy Shop is &c&lCLOSED&f. I'll be back with more treats!\""
    closed-info: "&dThe Candy Man isn't around right now! Come back when the Candy Shop opens."

# Peanut Butter Cup (issue #1198): a custom candy that eats like a Cookie. Eating one also gives
# a short effect that its name and lore deliberately keep secret (default Speed III for 6 seconds).
# Players in a running hosted event game never get it. Applies on /joshymc reload.
peanut-butter-cup:
  hidden-effect:
    # false = the cup is just a cookie
    enabled: true
    duration-ticks: 120
    # Zero-indexed: 0 = Speed I, 2 = Speed III
    amplifier: 2

# Link Pops (issue #1207): five custom candies (red, blue, green, purple, orange) that eat like a
# Cookie. Each colour also gives a short effect that its name and lore deliberately keep secret
# (defaults: red Resistance I 5s, blue Resistance I 6s, green Resistance II 7s, purple
# Resistance III 7s, orange Resistance III 11s). Players in a running hosted event game never get
# it. Amplifiers are zero-indexed (0 = level I), capped at 3; durations are capped at 5 minutes.
# Applies on /joshymc reload.
link-pops:
  red:
    hidden-effect:
      # false = this colour is just a cookie
      enabled: true
      duration-ticks: 100
      amplifier: 0
  blue:
    hidden-effect:
      enabled: true
      duration-ticks: 120
      amplifier: 0
  green:
    hidden-effect:
      enabled: true
      duration-ticks: 140
      amplifier: 1
  purple:
    hidden-effect:
      enabled: true
      duration-ticks: 140
      amplifier: 2
  orange:
    hidden-effect:
      enabled: true
      duration-ticks: 220
      amplifier: 2

# Joshy's Bar (issue #1204; called Joshees Bar before issue #1226, which is why the key below
# keeps its old name): a custom chocolate bar that eats like a Cookie. Eating one also gives
# a short effect that its name and lore deliberately keep secret (default Strength III for
# 9 seconds). Players in a running hosted event game never get it. The amplifier is capped at 4
# and the duration at 5 minutes. Applies on /joshymc reload.
joshees-bar:
  hidden-effect:
    # false = the bar is just a cookie
    enabled: true
    duration-ticks: 180
    # Zero-indexed: 0 = Strength I, 2 = Strength III
    amplifier: 2

# Rurus (issue #1205): a caramel-filled chocolate candy that eats like a Cookie. Eating one also
# gives a short effect that its name and lore deliberately keep secret (default Saturation I for
# 6 seconds). Players in a running hosted event game never get it. The amplifier is capped at 4
# and the duration at 1 minute. Applies on /joshymc reload.
rurus:
  hidden-effect:
    # false = the candy is just a cookie
    enabled: true
    duration-ticks: 120
    # Zero-indexed: 0 = Saturation I
    amplifier: 0

# Candy Corn (issue #1206): a Halloween candy that eats like a Cookie. Eating one also gives a
# short effect that its name and lore deliberately keep secret (default Regeneration V for
# 2 seconds). Players in a running hosted event game never get it. The amplifier is capped at 4
# and the duration at 1 minute. Applies on /joshymc reload.
candy-corn:
  hidden-effect:
    # false = the candy is just a cookie
    enabled: true
    duration-ticks: 40
    # Zero-indexed: 4 = Regeneration V
    amplifier: 4

# Quick Hit custom enchant (issue #1209): while the enchanted item is in the main hand, a full
# strength melee attack recharges this much faster. Damage per hit, mining speed and projectiles
# stay vanilla. Applied with /ce add quick_hit <level>; combines in anvils like other custom
# enchants. Applies on /joshymc reload.
quick-hit:
  # false = the enchant can't be applied and existing Quick Hit items do nothing (their level is kept)
  enabled: true
  max-level: 3
  # Percent of the recharge time removed per level (above 0, at most 50). 30 = 1s becomes 0.7s.
  cooldown-reduction-percent:
    '1': 10
    '2': 20
    '3': 30
  # Item groups that accept it: sword, axe, pickaxe, shovel, hoe, mace, trident, spear
  categories:
    - sword
    - axe
    - pickaxe
    - shovel
    - hoe
    - mace
    - trident

# Hosted Spleef and Sumo events (issue #1187). Staff run them through /event; arenas are
# saved presets made with /event arena.
hosted-events:
  # Event results and rewards (issue #1199). Reward presets per event type are set in game with
  # /event rewards (stored in data.db). A finished event waits for staff to confirm its result
  # (/event result) before anything is paid; payouts go through the store delivery queue, so
  # Coins/Credits arrive while offline and items arrive on the next join.
  results:
    # Broadcast the confirmed result ("Spleef has ended! Congratulations to ...!").
    announce: true
    # Highest value a single reward line may have. Higher values are refused when configured
    # and skipped (recorded in the audit log) if a cap is lowered later.
    limits:
      max-coins: 1000000
      max-credits: 1000
      # Tokens / crate keys per line.
      max-items: 64
      # Reward lines per event type.
      max-entries: 10
  spleef:
    countdown-seconds: 5
    min-players: 2
    # Rounds per event. After the last one the player with the most round wins is champion
    # and the event ends. 0 = keep playing rounds until staff run /event stop.
    max-rounds: 1
    # Seconds a round may last before it ends with no winner. 0 = no limit.
    round-time-limit-seconds: 0
    # The temporary shovel every player gets for the round. It never leaves the event world.
    shovel:
      material: DIAMOND_SHOVEL
      efficiency: 5
    floor:
      # Largest floor region Spleef will snapshot and restore.
      max-blocks: 50000
      # Restore the floor automatically after each round (it's always restored when the event ends).
      restore-after-round: true
      restore-delay-seconds: 3
      # Blocks restored per tick, so a big floor never lags the server.
      blocks-per-tick: 1000
  sumo:
    countdown-seconds: 3
    min-players: 2
    # Items each competitor gets for a match (material names). Empty = bare hands.
    loadout: []
    # Hits deal no damage; they only push. Sprinting hits push 1.5x as far.
    knockback:
      horizontal: 0.42
      vertical: 0.36
      hit-cooldown-ms: 450
    # Seconds before the next match starts by itself (with its countdown). 0 = staff start
    # every match with /event sumo next or the Game Controls menu.
    auto-next-seconds: 0
  # Sharks and Minnows: one Shark hit catches a crossing Minnow, who is a Shark from then on.
  # Minnows who make it cross again until the last Minnow finishes a crossing (1st place) or
  # every Minnow is caught (no 1st place). Everyone caught in the same crossing shares a place.
  sharks:
    countdown-seconds: 5
    min-players: 3
    # Random Sharks at the start. Always at least 1, and at least two Minnows are left.
    starting-sharks: 1
    # Minnows still crossing when this runs out are caught. 0 = no limit.
    crossing-time-limit-seconds: 60
    # Ignore a second tag from the same Shark within this many milliseconds.
    catch-cooldown-ms: 300
    # Seconds after a crossing before everyone is lined up on their spawn again.
    round-transition-delay-seconds: 3
    # Seconds after the line-up before the next crossing starts by itself (with its countdown).
    # 0 = staff start every crossing with /event sharks next or the Game Controls menu.
    auto-next-seconds: 5
  # Crystal PvP: single-elimination 1v1 with the kit saved by /event cpvp setkit. Staff start
  # each match after the first with /event cpvp next.
  cpvp:
    countdown-seconds: 5
    min-players: 2
    # Seconds a match may last; at the limit the healthier player wins. 0 = no limit.
    match-time-limit-seconds: 0
    # Both players out at the same moment (or equal health at the limit): rematch | both-out
    on-draw: rematch
    # Blocks competitors may place and break inside the Arena Boundary during a match.
    allowed-blocks:
      - OBSIDIAN
    restore:
      # Largest Arena Boundary that is snapshotted before each match and restored after it.
      max-blocks: 100000
      # Seconds after a match before the arena is restored (blocks-per-tick is shared with spleef.floor).
      delay-seconds: 2
  # Mob Waves: everyone fights the waves below together with the kit saved by /event mobs setkit.
  # Clearing the last wave with anyone alive wins (every survivor is a winner); everyone eliminated
  # loses. Rewards come from the Mob Waves preset (/event rewards), once staff confirm the result.
  # Mob Waves refuses to start while anything here is invalid; /event mobs status lists the problems.
  mobs:
    countdown-seconds: 5
    # Break between waves. Staff can end it early with /event mobs next.
    intermission-seconds: 15
    min-players: 1
    # Event mobs alive at once (hard cap 200). The rest of a wave waits until some die.
    max-active-mobs: 30
    # Most mobs a single wave may have (hard cap 1000).
    max-mobs-per-wave: 120
    # Mobs spawned per batch and ticks between batches (20 ticks = 1 second). Waves can override both.
    spawn-batch-size: 4
    spawn-interval-ticks: 20
    # Mobs never spawn closer than this many blocks to a living player.
    min-player-distance: 4
    # Ordinary mob drops (picked-up loot never leaves the event world). Mob equipment never drops,
    # and experience never drops at all: event-world XP would carry over into survival.
    drop-items: false
    # Full health, food and no effects for everyone still alive when a wave is cleared.
    heal-between-waves: true
    scaling:
      # Extra mob health per wave after the first (0.05 = +5% per wave), on top of each wave's own multiplier.
      health-per-wave: 0.05
    # Play only the first N waves below. 0 = all of them.
    waves-to-play: 0
    # Mobs waves may use. Ender dragons, withers, ghasts, phantoms and endermen are never allowed.
    allowed-entities:
      - ZOMBIE
      - HUSK
      - ZOMBIE_VILLAGER
      - DROWNED
      - SKELETON
      - STRAY
      - BOGGED
      - SPIDER
      - CAVE_SPIDER
      - CREEPER
      - WITCH
      - PILLAGER
      - VINDICATOR
      - WITHER_SKELETON
      - BLAZE
    # Waves, numbered 1, 2, 3, ... without gaps. Per wave:
    #   mobs: <TYPE>: <count>, or <TYPE>: { count, gear, health-multiplier, damage-multiplier, name }
    #   boss: { type, count (default 1), gear, health-multiplier, damage-multiplier, name } - spawns last and glows
    #   name, gear (none/leather/chainmail/golden/iron/diamond/netherite), health-multiplier (0.25-20),
    #   damage-multiplier (0.25-5), speed-multiplier (0.5-2), spawn-points (Mob Spawn Point numbers, default all),
    #   spawn-batch-size, spawn-interval-ticks
    # Waves you delete stay deleted; remove the whole waves section to get these defaults back.
    waves:
      '1':
        mobs:
          ZOMBIE: 4
      '2':
        mobs:
          ZOMBIE: 6
          SKELETON: 2
      '3':
        mobs:
          ZOMBIE: 6
          SKELETON: 3
          SPIDER: 3
      '4':
        gear: chainmail
        spawn-interval-ticks: 15
        mobs:
          ZOMBIE: 8
          SKELETON: 4
          SPIDER: 4
          CREEPER: 2
      '5':
        name: Boss Wave
        gear: iron
        health-multiplier: 1.2
        mobs:
          ZOMBIE: 6
          SKELETON: 4
          WITCH: 1
        boss:
          type: ZOMBIE
          name: Grave Warden
          gear: diamond
          health-multiplier: 6.0
          damage-multiplier: 1.5
