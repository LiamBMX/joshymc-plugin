# Resource pack — served automatically by the plugin
# The plugin bundles the pack and hosts it via a built-in HTTP server.
# port: the port the HTTP server listens on (default 8163)
# host: the hostname/IP players use to download the pack
#       leave blank for "localhost" (local testing)
#       set to your server's public IP or domain for production
resource-pack:
  port: 8163
  host: ""

# Optional override for the prefix on link messages. Leave empty to use the
# standard gold-gradient "SERVER »" prefix every other plugin message uses.
prefix: ""

# Feature Toggles — set to false to disable a system entirely
features:
  talismans: true
  custom-fishing: true
  quests: true
  event-quests: true
  market: true
  kill-effects: true
  custom-enchants: true
  anticheat: true
  combat-log-npc: true
  resource-world: true
  voting: true
  portals: true
  arenas: true
  npcs: false
  chat-games: true
  coinflip: true
  mob-stacking: false
  kill-streaks: true
  login-streaks: true
  orders: true
  giveaways: true
  gift: true
  casino: true
  candy-shop: true
  stuck-recovery: true

# Stuck-player recovery (issue #1241). Paper kicks "Flying is not enabled on this server" after a
# client reports floating for ~4s; a client that never received the chunk it stands in floats
# in place and gets that kick. None of this changes allow-flight or Paper's movement checks.
stuck-recovery:
  # Hold off the flying kick only while the chunk under the player was never sent to their client;
  # a second kick of the same incident moves them to their last safe spot / spawn.
  kick-grace: true
  # How long one held-off incident lasts, and how many incidents a player gets per window.
  grace-incident-seconds: 20
  max-grace-incidents: 3
  grace-window-minutes: 10
  # How old a remembered "last safe spot" may be and still be used.
  safe-spot-max-age-minutes: 10
  # Cooldown after a successful /unstuck (joshymc.unstuck.bypass skips it).
  unstuck-cooldown-seconds: 60
  # After a flying kick, a login within this many minutes starts at a safe spot instead.
  login-recovery-window-minutes: 15

# Gamemode isolation locks (issue #1289), toggled with /jgamemode lock|unlock <gamemode> confirm.
# While a gamemode is locked, the commands and features assigned to it only work on that gamemode.
# Unassigned commands are never affected.
gamemode-lock:
  # Which gamemode this server runs: survival or lifesteal.
  server-gamemode: survival
  # Worlds on this server that run a different gamemode, e.g. "lifesteal_world: lifesteal".
  worlds: {}
  # Extra command assignments by command name: survival, lifesteal or network.
  # Commands JoshyMC itself assigns can't be reassigned here.
  commands: {}

# Mob Stacking — merges nearby mobs of the same type into a single entity
mob-stacking:
  # Radius (in blocks) to search for nearby mobs to merge
  radius: 5.0
  # Maximum number of mobs that can be combined into one stack
  max-stack-size: 50

# Coinflip — 1v1 Player-vs-Player betting. No house cut: the winner takes the full pot.
coinflip:
  # Minimum bet amount
  min-bet: 1.0
  # Maximum bet amount (-1 = unlimited)
  max-bet: -1.0
  # Max WAITING (unmatched) Coinflips a single player can have listed at once
  max-waiting-per-player: 1
  # How long the flip animation runs for, in ticks (20 ticks = 1 second)
  animation-duration-ticks: 80
  # How long the result stays on screen before the GUI closes, in ticks
  result-display-ticks: 50

# Casino — Coins-only Mines/Roulette/Crash/Towers behind /casino. Never uses Credits.
casino:
  enabled: true
  # Minimum bet amount
  min-bet: 1000.0
  # Maximum bet amount (-1 = unlimited)
  max-bet: -1.0

  mines:
    enabled: true
    house-edge-percent: 3.0
    min-mines: 1
    max-mines: 10

  roulette:
    enabled: true
    house-edge-percent: 3.0

  crash:
    enabled: true
    house-edge-percent: 3.0
    betting-seconds: 20
    # Log routine round/bet activity (round started, bets, cashouts, crashes) to console.
    # Leave off in normal operation — errors/failures are always logged regardless of this.
    debug: false

  towers:
    enabled: true
    house-edge-percent: 3.0
    # Number of levels to climb before the tower auto-cashes-out
    levels: 8

  statistics:
    enabled: true

# Chat formatting
chat:
  # Format for player messages. Placeholders: {prefix}, {suffix}, {tag}, {player}, {message}
  format: "{prefix}{tag}{player}{suffix} &8» &f{message}"

  # Message sent after /chat clear. Placeholders: {player}
  clear-message: "&7Chat has been cleared by &f{player}&7."

  # Format for Staff Chat messages (/staffchat, /sc). Placeholders: {player}, {message}
  staffchat-format: "&8[&cStaff Chat&8] &f{player}&7: &f{message}"

  # Automatic spam mute: the same public chat message (case, outer spaces and repeated
  # spaces ignored) sent repeat-threshold times within window-ticks server ticks
  # (20 ticks = 1 second at full TPS) is blocked and the player is temp-muted by AutoMod.
  # Players with joshymc.antispam.bypass are never checked.
  anti-spam:
    enabled: true
    repeat-threshold: 6
    window-ticks: 30
    mute-duration-seconds: 3600
    mute-reason: "Spam"

# Server connection info shown by /ip
server-info:
  ip: "play.joshymc.net"
  port: 25565

discord:
  # Bot token from https://discord.com/developers/applications
  token: "YOUR_BOT_TOKEN_HERE"

  # Discord server (guild) the /online slash command is registered in. Leave empty to skip
  # slash command registration.
  guild-id: "1284630112234508330"

  # Format for messages sent TO Discord from Minecraft
  # Placeholders: {player}, {message}
  chat-format: "**{player}** » {message}"

  # Format for messages sent TO Minecraft from Discord
  # Placeholders: {name}, {message}
  # Only this format is parsed for & codes: Discord names and messages are always shown as
  # plain text on one line.
  minecraft-format: "&9[Discord] &f{name} &7» &f{message}"

  # /link account linking. Codes are random, use no look-alike characters (0/O, 1/I/L) and
  # are shown as XXXX-XXXX. The player still has to click Confirm in-game after the DM.
  linking:
    # Code length, 6-16 characters.
    code-length: 8
    # How long a /link code stays valid (60-1800).
    code-expiry-seconds: 300
    # Wrong codes one Discord account may DM before a temporary lockout.
    max-failed-attempts: 5
    # Window for counting wrong codes, and the lockout length after hitting the limit.
    attempt-cooldown-seconds: 600
    # Wrong codes per minute across all Discord accounts before code checks pause
    # briefly for everyone. 0 disables this server-wide cap.
    global-max-failed-per-minute: 120
    # LuckPerms group given to players while their Discord account is linked: added after
    # a confirmed /link, removed on /unlink, and repaired on join. Only this one parent
    # group is ever touched (never `parent set`); created empty if it doesn't exist.
    verified-group:
      enabled: true
      group: discord

  # Messages raised while the bot is still connecting (startup, /joshymc reload, or a
  # failed connection being retried) wait here and are sent once it connects. Punishment
  # logs never use this queue: they have their own durable one.
  delivery-queue:
    # Most messages held at once (10-10000). When full, the oldest chat message goes first;
    # alerts and reports are only pushed out by newer alerts.
    max-size: 500
    # Chat-bridge messages (chat, joins, deaths) older than this are dropped instead of being
    # replayed late. Alerts and reports never expire. 0 keeps chat until the queue is full.
    chat-max-age-seconds: 300

  # Channel ids the bot posts to. Feature feeds with their own section keep their channel
  # there, next to their toggles: anti-dupe.discord.channel-id, combat-alerts.discord.channel-id,
  # pvp-kill-logs.discord.channel-id, ancient-debris-monitor.discord-channel-id and
  # update-highlights.discord-channel. An empty or all-zero id turns that destination off.
  # Deprecated keys, copied here once on upgrade and ignored afterwards (you may delete them):
  #   discord.channel-id / discord.chat-channel-id      -> channels.chat
  #   staff-monitoring.anticheat-channel-id              -> channels.staff-anticheat
  #   staff-monitoring.reports-channel-id                -> channels.staff-reports
  #   punishments.forum-channel-id                       -> channels.punishments-forum
  channels:
    # Chat bridge + join/leave/death/start/stop events (all in one channel).
    chat: "000000000000000000"
    # Staff-monitoring alerts (anti-cheat, dupe, X-ray). Needs staff-monitoring.enabled.
    staff-anticheat: "1554209031994998904"
    # /report embeds. Needs staff-monitoring.enabled.
    staff-reports: "1554209119265751142"
    # Forum channel for punishment history: every warn/unwarn/mute/unmute/kick/ban/unban
    # is posted as an embed in that player's ONE forum post, matched by UUID (so name
    # changes reuse it). The bot needs View Channel, Create Posts, Send Messages in
    # Threads, Embed Links and Read Message History there, plus Manage Threads to reopen
    # locked posts.
    punishments-forum: "1557517197738250332"

  punishments:
    # Toggles the punishment history forum above.
    enabled: true
    # Tag for new posts (by name). Leave empty for none; if the forum requires a tag,
    # one named like "punish" (or else the first tag) is used.
    forum-tag: ""

  # Staff-monitoring server. Uses the same bot (it must be authorized in that server with
  # View Channel, Send Messages and Embed Links). Anti-cheat/dupe/mining alerts and /report
  # embeds are posted to discord.channels.staff-anticheat / staff-reports; nothing is
  # posted publicly.
  staff-monitoring:
    enabled: true

# Update Highlights: once the Discord bot above connects, a release build posts the
# player-facing highlights bundled in the JAR (src/main/resources/update-highlights.yml)
# as a "JoshyMC Update" embed. Each set of highlights posts once; restarts and reloads
# never repost it. Dev (-SNAPSHOT) builds never post. The bot needs View Channel, Send
# Messages and Embed Links in this channel.
update-highlights:
  enabled: true
  discord-channel: "1503533331340591134"

# Anti-Dupe — audit log + Discord alerts when a system catches a duplicate/replay
# attempt (e.g. an auction bought twice, a voucher redeemed twice). Detection only —
# never auto-bans, mutes, or reverses anything. Reuses the Discord bot above; set
# discord.channel-id below to a channel the bot can post embeds in.
# Alerts and their grouped follow-ups ALSO reach discord.channels.staff-anticheat (with
# staff monitoring on); if both ids are the same channel, it gets one copy.
anti-dupe:
  enabled: true

  discord:
    enabled: true
    channel-id: "1548819333394862151"

  # Which risk levels post a Discord embed. Everything is always written to the
  # audit log (anti_dupe_detections table) regardless of these toggles.
  alerts:
    low: false
    medium: true
    high: true
    critical: true

  # Repeats of the exact same detection type for the same player within this many
  # seconds are grouped into a single follow-up embed instead of spamming the channel.
  rate-limit-seconds: 10

# PvP Cheat Detection Alerts — Discord embeds when AntiCheatManager (or GrimAC, via the
# /jmc-violation bridge) flags combat-relevant cheating (KillAura, Reach, AutoClick/CPS,
# AntiKB/Velocity, AimSnap). Detection + staff alerting only — never auto-bans, kicks,
# mutes, or freezes anyone. Reuses the Discord bot above; set discord.channel-id below to
# a channel the bot can post embeds in.
# These detections ALSO reach discord.channels.staff-anticheat as staff alerts.
# That is intentional (a separate PvP feed with ping/TPS/evidence); if both ids are the same
# channel, only the staff alert posts there.
combat-alerts:
  enabled: true

  discord:
    enabled: true
    channel-id: "1550719798760177734"

  # Repeats of the exact same check for the same player within this many seconds are
  # grouped into a single follow-up embed instead of spamming the channel.
  rate-limit-seconds: 30

# PvP Kill Logs — Discord embed for every player-on-player kill (killer, victim, weapon,
# location, time). Only fires for kills with an identifiable player killer (melee or
# player-fired projectiles) — mob kills and environmental deaths are never announced.
# Reporting only — never touches kill streaks, bounties, or PvP rewards. Reuses the
# Discord bot above; set discord.channel-id below to a channel the bot can post embeds in.
# Shares the combat-alerts channel by default: kills and cheat alerts are different events,
# so nothing is posted twice.
pvp-kill-logs:
  enabled: true

  discord:
    channel-id: "1550719798760177734"

# Ancient Debris Monitor — logs every Ancient Debris a player mines to Discord and raises a
# one-shot alert when a player mines too many inside a rolling window (possible X-ray).
# Monitoring only — never cancels mining or kicks/bans/punishes anyone. Reuses the Discord
# bot above; set discord-channel-id to a channel the bot can post embeds in.
ancient-debris-monitor:
  enabled: true
  discord-channel-id: "1554473331456090182"
  window-minutes: 10
  suspicious-threshold: 8
  high-suspicion-threshold: 15
  # Routine "Ancient Debris Mined" logs are collected per player and posted as one summary
  # every this many seconds (10-3600). 0 posts every block on its own. X-ray alerts above
  # are never delayed by this.
  batch-interval-seconds: 60

# Recipe Blocker — block players from crafting specific items
# Use material names from: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
recipe-blocker:
  blocked-items:
    # - TNT
    # - END_CRYSTAL

# Combat — PvP toggle, combat tagging, flight/elytra disable
combat:
  tag-duration-seconds: 15
  # Whether players can use elytra while combat-tagged (toggle via /pvp elytra <on|off>)
  allow-elytra: false
  # Whether players can throw ender pearls while combat-tagged (toggle via /pvp enderpearl <on|off>)
  allow-enderpearl: false

# PvP world — the "pvp" world is isolated from player teleports (/spawn, /home,
# /warp, /tpa, /back, /rtp, ... and any other plugin's teleports in or out).
# Staff/console force teleports, JoshyMC portals and joshymc.pvp.teleport.bypass still work.
# /tpa, /tpahere and /tpaccept are refused whenever either player is in the PvP world.
pvp:
  block-player-teleports: true
  # Server warp that players may use to enter the PvP world (/warp pvp). It must
  # be set inside the "pvp" world (/setwarp pvp). Leave blank to disable.
  entry-warp: pvp

# PvP Kill Streaks — consecutive kills without dying. Milestones pay out cash,
# and once a player's streak reaches the bounty threshold, killing them
# transfers a % of their money to whoever ends their streak.
kill-streaks:
  # Whether ANY death (mob, fall, lava, void, etc.) resets the current streak.
  # If false, only PvP deaths reset it.
  reset-on-any-death: true
  # Streaks that trigger a milestone reward. Reward = milestone x reward-per-kill.
  milestones: [3, 5, 10, 15, 25, 50, 100, 200, 500]
  # Milestones at or above this streak get a server-wide broadcast; below it,
  # only the killer is told.
  milestone-broadcast-min-streak: 5
  milestone-rewards:
    enabled: true
    reward-per-kill: 10000
  bounty:
    enabled: true
    # Current streak a player must be on before dying puts their money at risk.
    minimum-streak: 5
    # % of the victim's current balance transferred to the killer.
    percentage: 10.0
    broadcast: true
  anti-farm:
    # The same killer -> victim pair only earns streak/bounty credit once per window.
    same-victim-cooldown-minutes: 30
  environmental-streak-loss:
    # Broadcast when a player loses a large streak to a non-PvP death (no money changes hands).
    broadcast: true
    minimum-streak: 10
  # Personal "You killed X! Kill Streak: N" message on every valid streak kill.
  kill-message: true

# Daily Login Streak — /loginstreak. Reuses the existing economy for the
# daily reward, Credits for the weekly bonus, and the crate system for the
# weekly bonus key. A day begins/ends at midnight in `timezone`. AFK time
# (per AFKManager) never counts toward the playtime requirement.
login-streaks:
  enabled: true
  # IANA time zone used for the daily boundary (handles DST automatically).
  # Matches the existing Daily Quest reset schedule by default.
  timezone: "America/New_York"
  # Eligible (non-AFK) playtime required to complete a Login day.
  required-playtime-minutes: 30
  gui:
    title: "Daily Login Streak"
    # How often the open GUI re-renders playtime/streak progress, in seconds.
    refresh-seconds: 2
  daily-reward:
    amount: 100000
  weekly-bonus:
    enabled: true
    # Every Nth completed streak day awards the bonus on top of the daily reward.
    every-days: 7
    credits: 100
    # One key is chosen at random from this list and given on a weekly bonus.
    eligible-keys:
      - "common"
      - "rare"
      - "joshy"
  grace:
    enabled: true
    # Number of consecutive successful Login completions required to restore
    # Grace after it's consumed.
    recharge-completed-days: 7

# The End — toggle via /dimension end <open|close> (ops only)
end:
  # Whether players can teleport into the End through end portals.
  # When false, players walking into an end portal simply phase through it
  # instead of being teleported.
  open: true

# External plugin integrations
integrations:
  # Grim AntiCheat — when JoshyMC sees Grim is installed, it auto-injects a
  # bridge command into Grim's punishments.yml so Grim's flags also show up
  # in JoshyMC's /admin → Top Violators list. Idempotent + non-destructive
  # (only adds an entry, never removes anything). Set false if you want to
  # configure Grim's punishments.yml manually.
  grim:
    auto-install: true

# Chat games — periodic chat-typing puzzles for online players
# Game types: math, type-the-phrase. Status is a utility-only check and is
# never randomly selected. An admin can manually trigger games with
# /chatgame [type].
chat-games:
  enabled: true
  # How often the auto-scheduler triggers a game when no game is running
  # and at least min-players are online. Floors at 30s. The legacy
  # `interval-minutes` field still works for older configs.
  interval-seconds: 900
  # Minimum online players required for the auto-scheduler to fire a game.
  # Manual /chatgame ignores this.
  min-players: 2
  # Auto-expire a game if no one solves it within this many seconds.
  solve-window-seconds: 60
  reward:
    # Credits (existing Credits economy) awarded to the winner.
    credits: 3

# Crates — debug toggles
# debug-interactions: when true, every right-click on a registered crate (or
# fuzzy-matched neighbour) is logged to the server console with the player,
# coords, hand, key state, and event-cancellation status. Useful for tracking
# down "right-clicking my spawn crate doesn't open the GUI" — leave off in
# production.
crates:
  debug-interactions: false

# Lag Cleaner — entity-threshold-based, only clears when needed
# Checks entity counts every check-interval-seconds
# Triggers a 30s countdown (with warnings at 30s, 10s, 3s) when thresholds are exceeded
# entity-threshold counts (and the clear removes) only hostile mobs in the Overworld,
# Nether and End. Passive/neutral mobs, villagers, golems, bosses, tamed, named and
# Citizens NPC mobs never count and are never removed.
#
# Defaults are intentionally generous — most servers only run into lag at much
# higher counts. Lower these if your server has < 1GB heap or you see TPS drops
# from mob crowding. Raise them if cleanups are firing too often.
lag-cleaner:
  enabled: true
  entity-threshold: 1500
  item-threshold: 800
  check-interval-seconds: 60
  # Shortest gap between the end of one lag clear and the start of the next automatic one
  minimum-trigger-interval-seconds: 300

# Mining — Veinminer, Auto Smelt, Tree Feller
mining:
  veinminer-max-blocks: 64
  treefeller-max-logs: 128

# Warps — player warps limit (server warps are unlimited, admin only)
# limits-by-rank: per-rank override. Use -1 for unlimited. Falls back to player-max-per-player if a rank has no entry.
warps:
  player-max-per-player: 3
  limits-by-rank:
    owner: -1
    admin: -1
    mod: -1
    helper: 5
    vip: 5
    member: 3
    default: 3

# Homes
# limits-by-rank: per-rank override. Use -1 for unlimited. Falls back to max-per-player if a rank has no entry.
homes:
  max-per-player: 3
  limits-by-rank:
    owner: -1
    admin: -1
    mod: -1
    helper: 5
    vip: 5
    member: 3
    default: 3

# AFK — rewards per interval while AFK. Configure any combination of money,
# items, and XP. Leave a reward at 0 / empty to skip it.
afk:
  world: "afk"
  reward:
    enabled: true
    interval: 10
    unit: "seconds"       # "seconds" or "minutes"
    money: 0              # money paid per interval (0 = none)
    xp: 0                 # vanilla XP levels per interval (0 = none)
    # Legacy single-item fields (kept for backwards compatibility).
    # If `items` below is non-empty it takes precedence and these are ignored.
    item: DIRT
    amount: 1
    # Full items list — each entry supports material, amount, chance (0-100).
    # Entries with chance < 100 roll independently each interval.
    #
    # `material` accepts three formats:
    #   1. Bukkit material  — DIRT, IRON_INGOT, DIAMOND, etc.
    #   2. Custom item id   — easter_egg, void_drill, bubble_butt_leggings, etc.
    #   3. Crate key        — crate:vote, key:afk  (must match a crate type)
    items:
      - material: DIRT
        amount: 1
        chance: 100
      # - material: IRON_INGOT
      #   amount: 1
      #   chance: 25
      # - material: easter_egg
      #   amount: 1
      #   chance: 10
      # - material: "key:afk"
      #   amount: 1
      #   chance: 100

# Player Vaults
vaults:
  max: 10

# Moderator Mode — /modmode staff toolkit (joshymc.modmode)
modmode:
  # Automatically vanish the staff member when Moderator Mode is enabled (unless already vanished)
  auto-vanish: true
  # Random Teleport tool eligibility
  rtp:
    exclude-vanished: true
    exclude-modmode-staff: true
  # Hotbar tool materials/names — leave a key out to use its default
  tools:
    punish:
      material: MACE
      name: "&cPunish Player"
    rtp:
      material: ENDER_PEARL
      name: "&dRandom Teleport"
    freeze:
      material: PACKED_ICE
      name: "&bFreeze Player"
    # Vanish is always GREEN_DYE (vanished) / GRAY_DYE (visible); its name reflects the state.
    invsee:
      material: ENDER_CHEST
      name: "&5Player Inventory"
    spectator:
      material: ENDER_EYE
      name: "&3Spectate"
    ecsee:
      material: CHEST
      name: "&6Ender Chest See"
    vault:
      material: BARREL
      name: "&2Player Vault See"

# RTP — Random Teleport
rtp:
  min-range: 500
  max-range: 5000
  cooldown-seconds: 60

# Auction House
auction:
  listing-duration-hours: 48
  max-listings-per-player: 5
  min-price: 1
  max-price: 1000000000
  tax-percent: 5

# Player-created Giveaways — /giveaway (alias /gwy)
giveaways:
  # Every giveaway lasts exactly this long. Normal players cannot override it.
  duration-hours: 24
  # Max ACTIVE giveaways a single player may host at once. 0 = unlimited.
  max-active-per-player: 1
  # Max ACTIVE giveaways server-wide. -1 = unlimited.
  max-active-total: -1
  allow-coins: true
  allow-items: true
  allow-description: true
  max-description-length: 120
  max-title-length: 32
  # Max prize item stacks a single giveaway can hold (1-45; the item rewards editor GUI has
  # 45 reward slots).
  max-prize-items: 27

# Player-to-player gifting — /gift, /gift mailbox
gift:
  # Max unclaimed gifts a single player may have outstanding as a sender. 0 = unlimited.
  max-pending-per-sender: 20
  # Max unclaimed gifts a single player's mailbox may hold as a recipient. 0 = unlimited.
  max-mailbox-size: 100
  # Cooldown between a player sending gifts. 0 = no cooldown.
  send-cooldown-seconds: 5
  allow-coins: true
  allow-message: true
  max-message-length: 120
  # Max item stacks a single gift can hold.
  max-gift-items: 27

# Buy Orders — /orders, a player-driven "I want this item" marketplace.
# Complements /ah (players sell what they have) without duplicating it —
# buy orders are always fully escrowed and only ever filled by real players.
orders:
  expiration-days: 7
  default-active-order-limit: 5
  minimum-price-per-item: 1
  maximum-price-per-item: 1000000000
  maximum-quantity-per-order: 100000
  # Custom items (PDC-tagged) cannot be requested/sold into orders unless enabled here.
  custom-items:
    enabled: false
  notifications:
    enabled: true
  # Staff/VIP TOTAL active-order overrides (separate from rank-perks below — these are
  # not purchasable ranks). Highest limit the player has permission for wins, and is used
  # only if it's greater than the base+rank-perk total. Permission node is "joshymc.orders.limit.<key>".
  limits:
    vip: 15
    admin: 50

# Rank Perks — configurable EXTRA Auction House listing slots, Buy Order slots, and a sell-price
# multiplier granted to purchasable ranks, on top of the base limits above
# (auction.max-listings-per-player / orders.default-active-order-limit). Formula for the
# listing/order limits: final limit = base limit + rank bonus. The sell-multiplier applies to
# /sell (deposit GUI, "/sell all <item>", "/sell hand") and Sell Wands: final payout = base sell
# value x sell-multiplier x any other multiplier already in play (e.g. Sell Wand, mutations).
#
# Eligibility is permission-based ("joshymc.rankperk.<key>"), granted to each rank's LuckPerms
# group externally — same pattern as /mcr. If a player is eligible for multiple rank perks
# (e.g. via LuckPerms inheritance), bonuses are NOT stacked: only the single highest-applicable
# rank's bonus is applied, and all three fields always come from that same rank.
rank-perks:
  scout:
    auction-extra-listings: 2
    orders-extra-orders: 2
    sell-multiplier: 1.05
  pathfinder:
    auction-extra-listings: 5
    orders-extra-orders: 5
    sell-multiplier: 1.10
  lumberjack:
    auction-extra-listings: 8
    orders-extra-orders: 8
    sell-multiplier: 1.15
  trailblazer:
    auction-extra-listings: 12
    orders-extra-orders: 12
    sell-multiplier: 1.20
  voyager:
    auction-extra-listings: 16
    orders-extra-orders: 16
    sell-multiplier: 1.25
  ranger:
    auction-extra-listings: 20
    orders-extra-orders: 20
    sell-multiplier: 1.30
  pioneer:
    auction-extra-listings: 25
    orders-extra-orders: 25
    sell-multiplier: 1.40

# Stock Market — /invest, a player-driven stock market (progressive percentage-based pricing)
stock-market:
  # Minimum dollar amount for a single purchase.
  minimum-buy: 1000.0
  # Cost for a player to create their own public stock.
  stock-creation-cost: 1000000.0
  # Starting price/share for newly created (player-owned) stocks. Server-owned stocks like
  # JOSH use server-stock-base-price instead — see below.
  default-stock-price: 10.0
  # Shares outstanding a newly created stock starts with (creator owns all of them).
  initial-shares: 100000.0
  # ── Pricing model — ALL stocks (player-created and server-owned alike) share this one model ──
  # There is NO server-funded buy/sell contribution or adjustment of any kind; buying and
  # selling always use the plain calculated transaction value. shares-per-price-step shares
  # trade at the current price before it takes its next pricing step:
  #  - below percentage-pricing-threshold: price moves by the flat low-price-tick amount.
  #  - at/above percentage-pricing-threshold: price moves by price-step-percent (e.g. 1.0 = 1%).
  # A trade smaller than the remaining capacity at the current price doesn't move it at all; a
  # large trade walks the ladder progressively, so it gets more expensive as it fills instead of
  # pricing the whole order at the starting price. Selling steps the price back down through the
  # exact mathematical inverse, so an immediate buy-then-sell of the same shares is reversible
  # (no free-money round trip). The ladder position is shared/global per stock (not per-holder),
  # so splitting one large order into many small ones can't dodge price impact either.
  # Absolute floor for any stock's price. Never $0, never negative, never NaN/Infinity.
  minimum-stock-price: 0.001
  # Flat per-step price movement while a stock is below percentage-pricing-threshold.
  low-price-tick: 0.01
  # Price at/above which pricing steps switch from the flat tick to a percentage move.
  percentage-pricing-threshold: 1.00
  # Per-step price movement, as a percentage (1.0 = 1%), once at/above the threshold.
  price-step-percent: 1.0
  # Shares tradable at the current price before it takes its next pricing step. Lower = price
  # moves more readily (more volatile); higher = a stock can absorb more volume before moving.
  shares-per-price-step: 10000.0
  # Starting price/share for the permanent JoshyMC (JOSH) server stock.
  server-stock-base-price: 10.0
  # Trading window (hours) used for 24h open/high/low/volume/activity/trend stats.
  market-activity-period-hours: 24
  # Buy/sell dollar amount at or above which a confirmation GUI is shown before executing.
  large-transaction-threshold: 500000.0
  # How long (seconds) a chat-input prompt (name/buy amount/sell amount) stays valid.
  chat-input-timeout-seconds: 30
  # Stock name length limits (players choose the full name; the ticker is auto-generated).
  name-min-length: 3
  name-max-length: 24
  # /stock promote <ticker> — flat cost per promotion. Advertisement only; never changes
  # stock price, market cap, shares outstanding, holdings, or the pricing algorithm.
  promotion-cost: 250000.0
  # Per-player cooldown (minutes) between /stock promote runs, regardless of which stock.
  promotion-cooldown-minutes: 30
  # Stocks (matched by ticker or name, case-insensitive) that /invest admin reset/delete may
  # never target. The JOSH server stock is always protected regardless of this list.
  protected-stocks: []
  # Pool of non-placeable materials randomly (and permanently) assigned as a stock's icon.
  icon-materials:
    - DIAMOND
    - EMERALD
    - PRISMARINE_CRYSTALS
    - PRISMARINE_SHARD
    - AMETHYST_SHARD
    - ECHO_SHARD
    - NETHER_STAR
    - BLAZE_POWDER
    - FIRE_CHARGE
    - GHAST_TEAR
    - HEART_OF_THE_SEA
    - RABBIT_FOOT
    - MAGMA_CREAM
  # 24h dollar-volume thresholds used to classify a stock's Market Activity tier.
  activity-thresholds:
    very-high: 1000000.0
    high: 250000.0
    moderate: 50000.0
    low: 5000.0
  # A stock's 24h % price change must exceed +/- this band to count as Growing/Decaying
  # rather than Stable.
  trend-stable-band-percent: 2.0

# Spawn World — auto-loads a schematic into a flat world
spawn-world:
  enabled: true
  schematic: "GETAWXY_LOBBY.schem"
  paste-x: 0
  paste-y: 64
  paste-z: 0

# Worlds where player-vs-player COLLISIONS are disabled by default.
# Players standing on the same block / running through each other won't push.
# Exceptions: collisions are auto-RE-ENABLED whenever a player is
#   - inside a PvP arena polygon, or
#   - currently combat-tagged
# So spawn / lobby can be friction-free without breaking PvP.
worlds:
  no-collision:
    - spawn

# World Borders — per-dimension, in blocks (full diameter)
# Applied on plugin start. The resource world also re-applies on regen.
world-borders:
  overworld: 10000
  resource: 10000
  nether: 10000
  end: 10000

# Resource World — resets periodically, has all structures
resource-world:
  enabled: true
  reset-interval-hours: 24
  world-name: "resource"
  border-size: 5000

# Auto Announcements — rotating broadcast messages
# Each message is shown as written, with no header line above it; the text is
# white unless it sets its own & colours. A staff /bc (/broadcast) shows the same
# text under a bold "★ Announcement ★" header, spaced off from chat.
# Two formats are supported per message:
#   - "plain text"                                  (uses default-sound)
#   - text: "..."  sound: ENTITY_EXPERIENCE_ORB_PICKUP  volume: 1.0  pitch: 1.5
