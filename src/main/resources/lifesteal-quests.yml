# ─────────────────────────────────────────────────────────────────────────────
# Lifesteal Daily & Weekly Quests (issue #1425). Lifesteal only: this file is only created and read
# on a server that runs Lifesteal, and the quests only run on the dedicated Lifesteal server (where
# the coin balances are Lifesteal Coins). The Survival quests (quest-cycle.yml) are separate and
# unchanged; no progress is ever shared between the two. Full guide: docs/lifesteal-quests.md.
#
# After editing, run /joshymc reload. A wrong setting pauses the quests (nothing stored is lost);
# a broken quest only skips that quest. Both are logged in the console with the reason.
# ─────────────────────────────────────────────────────────────────────────────

# false = no new progress, claims or rerolls and /quests says the quests are off. Nothing is
# deleted: everyone's quests and progress stay stored, and rewards already claimed are still delivered.
enabled: true

# Every reset uses this IANA timezone (daylight saving time included).
timezone: America/New_York

daily:
  # Daily quests reset every day at this local time ("HH:mm").
  reset-time: "00:00"
  # Quests each player gets per day (1 to 3).
  quests-per-cycle: 3

weekly:
  # Weekly quests reset on this day at this local time.
  reset-day: MONDAY
  reset-time: "00:00"
  quests-per-cycle: 3

rerolls:
  # Rerolling replaces one quest that isn't complete with a different one. A quest can't be rolled
  # back in the same cycle, claimed or completed quests can't be rerolled, and a reroll never
  # changes the rewards of any other quest.
  daily:
    # Free rerolls per player per day.
    free-per-cycle: 1
    # Credits per reroll after the free ones (0 = free).
    credit-cost: 25
    # Paid rerolls allowed per day (0 = none).
    max-paid-per-cycle: 3
  weekly:
    free-per-cycle: 0
    credit-cost: 75
    max-paid-per-cycle: 2
  # A team-only quest held by someone who has since left their team can be rerolled for free
  # (it doesn't use up a free or paid reroll).
  free-when-ineligible: true

# Only legitimate gameplay in Lifesteal worlds counts. PvP quests use the same rules as bounty
# claims: no events, PvP arenas, Ranked Team Wars matches or arenas, no teammates or allies, and
# nothing while team data is unavailable. Creative/Spectator, Mod Mode and the event world never count.
anti-abuse:
  # Minutes before killing the same player counts again for the same killer (0 to 10080).
  pvp-same-victim-cooldown-minutes: 30
  # Most kills per player per hour that count (0 = no limit).
  pvp-max-kills-per-hour: 10
  # Kills, damage and bounty claims between players who have shared a connection (the /alts data)
  # never count. A failed lookup never counts either.
  pvp-block-shared-connections: true
  # Hearts of PvP damage one attacker can count against one victim per hour (0 = no limit).
  pvp-damage-cap-hearts-per-victim-per-hour: 40
  # A kill is a won fight (pvp_victory) when the victim had hit the killer within this many seconds.
  victory-window-seconds: 30
  # Teammates who hit the victim within this many seconds before a kill get a team assist.
  assist-window-seconds: 15
  # Teamwork quests count while an active teammate is within this many blocks.
  team-radius: 48
  # Players with no input for this many seconds (or /afk) are idle: their kills, catches, mobs and
  # walking don't count, and killing an idle player doesn't count either.
  idle-seconds: 120
  # Mob spawn reasons that count for mob quests. Spawners, spawn eggs and plugin spawns are left out.
  mob-spawn-reasons: [NATURAL, DEFAULT, REINFORCEMENTS, JOCKEY, PATROL, RAID, VILLAGE_INVASION]
  # Most mob kills per player per minute that count (0 = no limit).
  max-mob-kills-per-minute: 40
  # Minimum seconds between two counted catches.
  fishing-min-interval-seconds: 3
  # Ores only count when mined with a tool that drops them. Player-placed and generator blocks
  # never count for ores, crops or gathering.
  require-correct-tool: true
  # Exploration: faster horizontal movement than this (blocks per second) never counts. Vehicles,
  # elytra, flying, riptide, teleports and small loops never count either.
  explore-max-blocks-per-second: 12

gui:
  title: "&8Lifesteal Quests"
  reroll-title: "&8Confirm Reroll"

messages:
  # Shown when a quest is completed. {quest} {period}
  completion-enabled: true
  completed: "&a&lQUEST COMPLETE! &7{period} quest &f{quest}&7 is done. Claim it in &e/quests&7."
  # {quest} {rewards}
  claimed: "&aYou claimed &f{quest}&a: &6{rewards}&a."
  # {old} {new} {cost}
  rerolled: "&aRerolled &f{old}&a into &f{new}&a{cost}."
  disabled: "&cLifesteal quests are turned off right now."

# ─────────────────────────────────────────────────────────────────────────────
# Quest pools. Each quest:
#   name, description ({target} = the target), category (combat | survival | teamwork; must match
#   the objective), objective, target, rewards, and optionally
#   match: [..]     only these materials / entity types count (where the objective supports it)
#   team: any | required | none    (none = only players without a team: the solo alternatives;
#                                   every teamwork objective is team: required)
#   weight: 1..10000 (default 10)  how likely it is to be picked
#   group: <name>   quests sharing a group never appear together in one cycle
#   enabled: true | false
# A player never gets two quests with the same objective (or group) in one cycle.
#
# Objectives:
#   combat:   player_kill, unique_player_kill, pvp_damage (target in hearts), bounty_claim, pvp_victory
#   survival: mine_ore, harvest_crop, catch_fish, kill_mob (hostile mobs), explore (target in blocks),
#             gather_block (needs match)
#   teamwork: team_assist, team_pvp_kill, team_mob_kill, team_mine_ore, team_explore
#
# Rewards (each a line): "coins <amount>", "credits <amount>", "cratekey <crate id> <quantity>",
#   "chattagvoucher <voucher tag id> <quantity>". Crates and chat tags must exist on this server
#   (/crate list, /voucher tag list), otherwise that quest is skipped. Rewards are delivered through
#   the store-delivery queue (works offline, never dropped). Hearts, ranks and commands can't be
#   quest rewards. Example: rewards: ["coins 15000", "cratekey vote 1"]
#
# Deleting a quest here removes it for good (pools are never merged back from the plugin's copy).
# Quests a player already has keep the name, target and rewards they were given.
# ─────────────────────────────────────────────────────────────────────────────
