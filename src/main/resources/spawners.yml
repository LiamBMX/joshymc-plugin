# Spawners — plain Minecraft mob spawners, sold here for convenience.
#
# Placing one of these creates a normal vanilla spawner block: it spawns the
# configured mob on the usual vanilla timer and the mob drops its normal
# loot. There is no custom GUI, storage, or production system — these
# spawners behave exactly like a spawner picked up from a dungeon with Silk
# Touch.
#
# Fields:
#   display-name: Item name shown in inventory and in /spawner shop
#   mob: Vanilla EntityType the spawner spawns
#   buy-price: Cost to purchase from /spawner shop (omit or set to -1 to hide)

spawners:
  zombie:
    display-name: "&aZombie Spawner"
    mob: ZOMBIE
    buy-price: 25000

