# Chat Tags Configuration
# Players can equip one tag that displays before their name in chat.
# display: Text shown in chat using & color codes (trailing space included)
# permission: Permission node required (null = free for all)
#
# Approved categories only — see issue #602. The "voucher" category (shown to
# players as "Special Chat Tags") holds the bundled voucher tags at the bottom of
# this file (issue #1391) plus any an admin adds with `/voucher create <id> <display>`.
# Every voucher tag needs its own joshymc.tag.voucher.<id> node or a redeemed voucher.
# A bundled voucher tag removed with `/voucher tag delete` is listed under
# removed-voucher-defaults and is not merged back in on the next start.

