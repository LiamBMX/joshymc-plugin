  # Bundled Special Chat Tags (issue #1391). Each one needs its own
  # joshymc.tag.voucher.<id> node (registered default false, so no rank or op
  # inherits it) or a redeemed voucher (/voucher give <player> chattag_<id>).
  # Gradients are per-letter &#RRGGBB codes, no bold/obfuscated; the opening
  # bracket and symbol take the start colour, the closing bracket the end colour,
  # and &r ends the tag. Symbols are Basic Multilingual Plane only: the requested
  # emoji were swapped (maple leaf -> ❦, honey pot -> ⬢, fire -> ✹), see
  # docs/chat-tags.md. Regression checks: scripts/VoucherTagCheck.kt.
  voucher:
    mapleborn:
      # [❦ Mapleborn]  #E8571E -> #F2B33D
      display: "&#E8571E[❦ &#E8571EM&#E96222a&#EA6E26p&#EC7A2Al&#ED852Ee&#EE9031b&#F09C35o&#F1A839r&#F2B33Dn&#F2B33D]&r "
      permission: joshymc.tag.voucher.mapleborn
    hearthbound:
      # [⌂ Hearthbound]  #FFB627 -> #B8693D
      display: "&#FFB627[⌂ &#FFB627H&#F8AE29e&#F1A72Ba&#EA9F2Er&#E39730t&#DC9032h&#D48834b&#CD8036o&#C67839u&#BF713Bn&#B8693Dd&#B8693D]&r "
      permission: joshymc.tag.voucher.hearthbound
    moonmoss:
