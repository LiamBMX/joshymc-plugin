      display: "&#A3B58F[☾ &#A3B58FM&#97B191o&#8BAD92o&#7FA994n&#73A696m&#67A298o&#5B9E99s&#4F9A9Bs&#4F9A9B]&r "
      permission: joshymc.tag.voucher.moonmoss
    lanternlit:
