# JoshyMC Shop Configuration
#
# /shop is a server-controlled MONEY SINK, not the main way players trade with each
# other — that's what /ah (auction house) and /orders (buy orders) are for. Keep this
# file focused on convenience / progression / PvP / decorative items; general bulk
# resources (ores, crops, building blocks, mob drops, etc.) belong in the player
# economy, not here.
#
# Every price is configurable. buy: 0 means the item cannot be bought. sell: 0 means
# the item cannot be sold back (selling is disabled by default for everything in this
# file — /shop is not meant to compete with /ah as a sell outlet).
#
# Fields per item:
#   buy       - price to purchase (0 = not for sale)
#   sell      - price paid when sold back (0 = cannot sell, the default)
#   enabled   - set to false to hide the item entirely (default true)
#   material  - only needed when the yaml key isn't itself a valid Material name
#               (e.g. multiple potions that all use Material.SPLASH_POTION)
#   name      - display name override (defaults to a title-cased material name)
#   effect    - potion effect type (e.g. STRENGTH, SPEED, INSTANT_HEALTH) — marks
#               this entry as a real potion item instead of a plain Material
#   amplifier - potion effect amplifier, 0 = level I, 1 = level II, etc.
#   spawner   - custom spawner type id from spawners.yml (e.g. "zombie") — marks this
#               entry as a spawner item delivered via SpawnerManager.createSpawnerItem,
#               so the correct mob type/PDC tag is always preserved (never a generic
#               fallback). material defaults to SPAWNER for these entries.

