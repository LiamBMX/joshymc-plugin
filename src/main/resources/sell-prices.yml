# JoshyMC Sell Prices — the ONE central source of truth for /sell.
#
# This is completely separate from shop.yml (/shop is a curated buy-only
# money sink). /sell is the broad outlet for normal survival-obtainable
# vanilla items: open /sell, drop items into the deposit GUI, close it to
# sell everything valid.
#
# Only materials listed below can be sold. Armor, tools, weapons, spawners,
# spawn eggs, and admin/creative/unobtainable blocks are intentionally left
# out entirely instead of needing a separate blacklist — if it's not listed
# here, /sell will politely hand it straight back to the player.
#
# Prices are PER SINGLE ITEM (not per stack) and support decimals, e.g.
# Dirt at 0.25 means a stack of 64 sells for exactly $16.00.
#
# JoshyMC custom items (anything tagged with a custom item id) are always
# rejected regardless of what's configured here for their base material.
