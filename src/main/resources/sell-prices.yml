# JoshyMC Sell Price Catalog
#
# This is the single source of truth for "what is this item worth" across the whole
# plugin. ServerShopManager.getSellPrice()/getBaseSellPrice() read from this file (in
# addition to shop.yml) — both /sell and /worth use those same methods, so a price
# changed here updates everywhere automatically. There is no separate config for /worth.
#
# Unlike shop.yml (a server-controlled money-sink shop for gear/decor/convenience
# items), this file exists specifically for the bulk-resource sell economy — ores,
# crops, building blocks, mob drops, etc. — that shop.yml intentionally excludes.
#
# Fields per item (same shape as shop.yml, "buy" is simply omitted/left at 0):
#   sell      - price paid when sold via /sell (0 or omitted = cannot sell)
#   enabled   - set to false to hide the item entirely (default true)
#   material  - only needed when the yaml key isn't itself a valid Material name
#   name      - display name override (defaults to a title-cased material name)
#
# Do NOT add tools/weapons/armor, spawners, spawn eggs, or admin/unobtainable items
# here — those stay non-sellable by design.

