# What each placeholder becomes once it exists here: "cratekey <crate id>",
# "chattagvoucher <tag id>" or "tokens" (the quantity comes from the day's line).
# "" = not set up yet: claimed copies wait (never lost) and are delivered after
# you map it and run /advent admin reload. None of these exist in JoshyMC yet:
# Lifesteal has no crates, Survival has no crate marked premium, and the
# collectibles/cosmetics need items (with art) first. See docs/advent-calendar.md.
placeholders:
  survival_premium_crate_key: ""
  lifesteal_standard_crate_key: ""
  lifesteal_upgraded_crate_key: ""
  lifesteal_premium_crate_key: ""
  snow_globe: ""
  christmas_bell: ""
  christmas_2026_collectible: ""
  winter_scarf: ""
  winter_trail: ""
  survival_festive_cosmetic: ""
  lifesteal_festive_cosmetic: ""
